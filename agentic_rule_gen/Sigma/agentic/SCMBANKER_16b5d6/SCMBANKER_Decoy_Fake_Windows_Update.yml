title: SCMBANKER Decoy Fake Windows Update
id: 9a8b7c6d-5e4f-4a3b-8c2d-1f0e9d8c7b6a
status: experimental
description: Detects the launch of Microsoft Edge in fullscreen kiosk mode to display a fake Windows Update page, a distraction technique used by SCMBANKER.
references:
    - https://www.elastic.co/security-labs/threat-command/mexican-banking-fraud-scmbanker-ref6045
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.defense_evasion
    - attack.t1204.001
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\msedge.exe'
        CommandLine|contains|all:
            - '--kiosk'
            - '--edge-kiosk-type=fullscreen'
            - 'fakeupdate.net'
    condition: selection
falsepositives:
    - Other malware or social engineering campaigns using the same technique.
    - Administrators using kiosk mode for legitimate purposes, though the combination with fakeupdate.net is highly suspicious.
level: medium
