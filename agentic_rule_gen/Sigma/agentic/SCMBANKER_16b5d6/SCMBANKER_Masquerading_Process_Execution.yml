title: SCMBANKER Masquerading Process Execution
id: a7e36ca2-4886-4fca-86b3-6c84138e4a9e
status: experimental
description: Detects masquerading process names used by SCMBANKER rotator components, which are often typos of legitimate Windows processes and executed from non-standard user-writable paths.
references:
    - https://www.elastic.co/security-labs/threat-command/mexican-banking-fraud-scmbanker-ref6045
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.defense_evasion
    - attack.t1036.005
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\DrioverrHost.exe'
            - '\WmirPrvSE.exe'
            - '\UpdaterTask.exe'
        Image|contains:
            - '\AppData\Local\'
            - '\AppData\Roaming\'
            - '\ProgramData\'
            - '\Users\Public\'
    condition: selection
falsepositives:
    - Legitimate software using the same executable names and installed in common user-writable locations.
level: high
