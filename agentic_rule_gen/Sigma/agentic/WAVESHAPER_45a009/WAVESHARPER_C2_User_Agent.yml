title: WAVESHAPER RAT C2 User-Agent
id: a7d0840b-7822-4e94-874b-ab460aa5d54b
status: experimental
description: Detects C2 communications from the WAVESHAPER RAT. This detection is based on a combination of the anachronistic Internet Explorer 8 User-Agent string, the use of the POST method, and a 404 status code in the response.
references:
    - https://www.elastic.co/security-labs/threat-command/axios-one-rat-to-rule-them-all
author: ioc-yara-daily (agentic)
date: 2023-10-27
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection:
        cs-user-agent: 'mozilla/4.0 (compatible; msie 8.0; windows nt 5.1; trident/4.0)'
        cs-method: 'POST'
        sc-status: 404
    condition: selection
falsepositives:
    - Legacy systems or internal applications that might exhibit similar, unusual traffic patterns.
level: high
