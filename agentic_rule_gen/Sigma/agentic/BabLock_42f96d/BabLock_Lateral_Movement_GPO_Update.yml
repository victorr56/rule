title: BabLock Lateral Movement via GPO Force Update
id: 97f74ca3-b8ad-4a0b-8088-3ef99661445b
status: experimental
description: Detects the use of PowerShell to force an immediate GPO update across domain computers, a technique used by BabLock for lateral movement.
references:
    - https://www.group-ib.com/blog/bablock-ransomware/
author: ioc-yara-daily (agentic)
date: 2024-07-24
tags:
    - attack.lateral_movement
    - attack.t1484.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_ps:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'Invoke-GPUpdate'
            - '-force'
            - '-RandomDelayInMinutes 0'
    selection_pwsh:
        Image|endswith: '\pwsh.exe'
        CommandLine|contains|all:
            - 'Invoke-GPUpdate'
            - '-force'
            - '-RandomDelayInMinutes 0'
    condition: 1 of selection_*
falsepositives:
    - System administrators may use similar commands for legitimate administrative purposes, although the combination of forcing an update with a zero-minute random delay is less common and warrants investigation.
level: medium
