title: MATCHBOIL Staging File Creation
id: 031317de-32f2-45e0-b6f7-b2f90a501a30
status: experimental
description: Detects the loading of the MATCHBOIL handler DLL 'config.library-ms'. The use of this file by rundll32.exe is a strong indicator of the malware's staging process having occurred.
references:
    - https://www.welivesecurity.com/en/eset-research/matchboil-new-tricks-same-old-evil-intentions/
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.execution
    - attack.t1218.011
logsource:
    category: image_load
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32.exe'
        ImageLoaded|endswith: '\Users\Public\Libraries\config.library-ms'
    condition: selection
falsepositives:
    - Unlikely
level: high
