title: FishMonger SprySOCKS Persistence via Print Processor
id: 59374189-d41f-4952-b891-b3b421a97d76
status: experimental
description: Detects the creation of the 'VSPMsg' print processor used by the WIN_PLUS variant of the SprySOCKS backdoor for persistence.
references:
    - https://www.welivesecurity.com/en/eset-research/fishmongers-arsenal-upgraded-sprysocks-windows/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.persistence
    - attack.t1546.012
    - detection.threat_hunting
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\Print\Environments\Windows x64\Print Processors\VSPMsg\Driver'
        Details|endswith: '\VSPMsg.dll'
    condition: selection
falsepositives:
    - Unlikely
level: high
