title: FishMonger SprySOCKS Persistence via VDS.exe IFEO
id: 8467df92-628d-4f1e-9310-9b418641a9dd
status: experimental
description: Detects the use of Image File Execution Options (IFEO) to hijack vds.exe for persistence, a technique used by the WIN_DRV variant of SprySOCKS.
references:
    - https://www.welivesecurity.com/en/eset-research/fishmongers-arsenal-upgraded-sprysocks-windows/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.persistence
    - attack.t1546.012
    - detection.threat_hunting
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\Image File Execution Options\vds.exe\Debugger'
        Details|contains: 'ApphostRagistreationVerifier.exe'
    condition: selection
falsepositives:
    - Unlikely
level: high
