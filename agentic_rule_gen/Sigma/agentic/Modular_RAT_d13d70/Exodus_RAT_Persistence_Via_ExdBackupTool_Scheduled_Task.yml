title: Exodus RAT Persistence Via ExdBackupTool Scheduled Task
id: e300d89e-4c74-42f0-9a3d-4c32b507f309
status: experimental
description: Detects the creation of a scheduled task named 'ExdBackupTool' used by a modular RAT to persist a trojanized Exodus wallet.
references:
    - https://www.huntress.com/blog/exodus-crypto-wallet-installer-rat
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/tn ExdBackupTool'
            - 'ExdBackupTool\Exodus.exe'
            - '/sc HOURLY'
    condition: selection
falsepositives:
    - Unlikely.
level: high
