title: SocGholish and RansomHub C2 Infrastructure
id: 489f666f-4d37-4f9e-a035-711e53ec6e2d
status: experimental
description: Detects network connections to IP addresses and ports associated with SocGholish and RansomHub C2 and infrastructure. This includes WebDAV servers for credential theft and the Python backdoor C2.
references:
    - https://www.darktrace.com/blog/socgholish-from-loader-and-c2-activity-to-ransomhub-deployment
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.command_and_control
    - attack.credential_access
    - attack.t1187
    - attack.t1071.001
    - attack.t1571
logsource:
    category: network_connection
    product: windows
detection:
    selection_webdav:
        DestinationIp: '161.35.56.33'
    selection_c2:
        DestinationIp:
            - '185.174.101.240'
            - '185.174.101.69'
            - '108.181.182.143'
        DestinationPort:
            - 2308
            - 2311
            - 2313
    condition: 1 of selection_*
falsepositives:
    - IP addresses could be re-allocated to benign entities over time.
level: high
