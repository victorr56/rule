title: Suspicious NetScaler HA Synchronization Command
id: f0e31e5f-141a-4720-afab-bb67503da047
status: experimental
description: 'Detects the execution of "sync HA files all" on a NetScaler appliance. This command was used by attackers to synchronize their implant to a high-availability peer.'
references:
    - https://www.mandiant.com/resources/blog/cutting-edge-part-2-investigating-unc3944
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.lateral_movement
    - attack.t1072
    - detection.threat_hunting
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith: '/sh'
        CommandLine|contains: 'sync HA files all'
    condition: selection
falsepositives:
    - Legitimate use of this command by administrators for high-availability synchronization.
level: medium
