title: SLAPSHOT Webshell Access Pattern
id: 3c6218d8-5712-4cf0-8339-e48f76633a6b
status: experimental
description: Detects web requests matching the URL pattern used to access the SLAPSHOT webshell.
references:
  - https://www.rapid7.com/blog/post/2024/06/18/ra-netscaler-intrusions-chaining-cve-2023-4966-and-cve-2023-6549/
author: ioc-yara-daily (agentic)
date: 2024-06-18
tags:
  - attack.persistence
  - attack.t1505.003
logsource:
  category: proxy
detection:
  selection:
    Url|contains|all:
      - '/logon/LogonPoint/custom/receiver.v2.min.'
      - '.css'
    cs_method: 'POST'
  condition: selection
falsepositives:
  - Unlikely
level: critical
