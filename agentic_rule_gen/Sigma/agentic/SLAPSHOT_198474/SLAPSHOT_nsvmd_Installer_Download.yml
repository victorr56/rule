title: SLAPSHOT nsvmd Installer Download
id: 61e1493c-230c-4fa2-8b9a-7c90b6a2eb67
status: experimental
description: Detects the command line used to download and execute the nsvmd installer script via curl and a pipe to sh.
references:
  - https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779
author: ioc-yara-daily (agentic)
date: 2026-10-22
tags:
  - attack.execution
  - attack.t1059.004
  - attack.t1105
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
      - '/sh'
      - '/bash'
    CommandLine|contains|all:
      - 'curl'
      - 'v5v.in/r.sh'
  condition: selection
falsepositives:
  - Unlikely
level: high
