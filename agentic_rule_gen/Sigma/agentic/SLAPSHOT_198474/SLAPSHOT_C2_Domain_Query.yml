title: SLAPSHOT C2 Domain Query
id: 3c6218d8-5712-4cf0-8339-e48f76633c1d
status: experimental
description: Detects DNS queries for domains associated with the SLAPSHOT malware C2 infrastructure.
references:
  - https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779
author: ioc-yara-daily (agentic)
date: 2026-10-22
tags:
  - attack.command_and_control
  - attack.t1071.001
logsource:
  category: dns_query
  product: windows
detection:
  selection:
    QueryName:
      - 'v5v.in'
      - 'c.v5v.in'
  condition: selection
falsepositives:
  - Unlikely
level: high
