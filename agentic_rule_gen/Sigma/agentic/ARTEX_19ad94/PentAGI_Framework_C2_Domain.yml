title: PentAGI Framework C2 Domain
id: f450e189-53b4-4e4b-b0b2-4d8b67139199
status: experimental
description: Detects DNS queries for a domain known to be used by the PentAGI agentic C2 framework.
references:
    - https://www.elastic.co/security-labs/threat-command/agentic-offensive-frameworks-detection-artex
author: ioc-yara-daily (agentic)
date: 2026-11-20
tags:
    - attack.command_and_control
    - attack.t1071
logsource:
    category: dns_query
detection:
    selection:
        QueryName: 'update.pentagi.com'
    condition: selection
falsepositives:
    - Unlikely
level: high
