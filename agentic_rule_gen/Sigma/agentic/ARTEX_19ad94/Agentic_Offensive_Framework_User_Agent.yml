title: Agentic Offensive Framework User-Agent (ARTEX, CyberStrikeAI, HexStrike)
id: 57904e5d-16a7-4b71-923f-e8b3b7274099
status: experimental
description: Detects unique User-Agent strings associated with agentic offensive frameworks like ARTEX, CyberStrikeAI, and HexStrike.
references:
    - https://www.elastic.co/security-labs/threat-command/agentic-offensive-frameworks-detection-artex
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection:
        UserAgent|contains:
            - 'artex-enrich/1.0'
            - 'CyberStrikeAI-WebShell/1.0'
            - 'HexStrike-HTTP-Framework/1.0'
            - 'HexStrike-BrowserAgent/1.0'
            - 'norma/0.4'
        HttpCode: 200
    condition: selection
falsepositives:
    - Unlikely
level: high
