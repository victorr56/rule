title: UltraRank SnifLite C2 Domains
id: 59371720-c637-4f6c-bb76-2ec2b5cc36fe
status: experimental
description: Detects DNS queries for domains associated with the UltraRank group's SnifLite JavaScript skimmer.
references:
    - https://www.group-ib.com/blog/ultrarank/
author: ioc-yara-daily (agentic)
date: 2026-10-24
tags:
    - attack.command_and_control
    - attack.t1071
    - attack.exfiltration
    - attack.t1041
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName|endswith:
            - '.googletagsmanager.co'
            - '.s-panel.su'
            - '.googletagsmanager.info'
    condition: selection
falsepositives:
    - Unlikely
level: high
