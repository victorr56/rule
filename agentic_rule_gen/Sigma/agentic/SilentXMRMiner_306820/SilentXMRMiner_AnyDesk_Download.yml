title: Suspicious AnyDesk Download to ProgramData Directory
id: 8871309f-44e2-411a-9669-70334863c3d5
status: experimental
description: Detects the download of 'AnyDesk.exe' to the 'C:\ProgramData' directory using common command-line utilities like certutil or PowerShell.
references:
    - https://www.huntress.com/blog/threat-actor-compiles-cryptominer
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.command_and_control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_certutil:
        Image|endswith: '\certutil.exe'
        CommandLine|contains|all:
            - '-urlcache'
            - 'AnyDesk.exe'
            - 'C:\ProgramData\'
    selection_ps_iwr:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'Invoke-WebRequest'
            - 'AnyDesk.exe'
            - 'C:\ProgramData\'
    selection_ps_wc:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - '.DownloadFile'
            - 'AnyDesk.exe'
            - 'C:\ProgramData\'
    condition: 1 of selection_*
falsepositives:
    - Legitimate but unusual software deployment scripts.
level: medium
