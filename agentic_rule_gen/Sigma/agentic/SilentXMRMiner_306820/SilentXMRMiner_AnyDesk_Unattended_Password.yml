title: Unattended AnyDesk Password Set In ProgramData
id: 97893ca6-8a03-4fec-88c9-57ef9acfa4b9
status: experimental
description: Detects the setting of an unattended access password for an AnyDesk instance located in the C:\ProgramData directory, a technique used by attackers to gain persistent remote access.
references:
    - https://www.huntress.com/blog/threat-actor-compiles-cryptominer
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.remote_access_software
    - attack.t1219
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image: 'C:\ProgramData\AnyDesk.exe'
        CommandLine|contains: '--set-password'
    condition: selection
falsepositives:
    - Legitimate administrative use of AnyDesk from an unusual path, which is rare.
level: high
