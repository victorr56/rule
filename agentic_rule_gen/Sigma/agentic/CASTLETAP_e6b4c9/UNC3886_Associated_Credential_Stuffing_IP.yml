title: Network Connection to UNC3886 Associated Credential Stuffing IP
id: d43d0e2e-2e2d-4d76-880c-03e5c9b2d358
status: experimental
description: Detects outbound network connections to IP addresses associated with UNC3886 credential stuffing and other malicious activities. A connection from an internal host may indicate it is compromised.
references:
    - https://www.wiz.io/blog/agentless-threat-hunting-fortigate
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.command_and_control
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        DestinationIp:
            - '101.36.122.139'
            - '107.150.105.153'
            - '113.141.72.65'
            - '118.196.30.45'
            - '118.33.113.91'
            - '183.87.217.222'
            - '194.113.195.96'
            - '2.58.57.140'
            - '205.235.2.176'
            - '43.155.214.159'
    condition: selection
falsepositives:
    - These IPs could be reassigned to benign services over time.
level: high
