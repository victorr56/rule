title: DPRK FAMOUS CHOMILLA-Related VDO.Ninja Screen Sharing
id: c2d3a9b1-e83c-41c1-8b2b-6c8f8b3c9b7c
status: experimental
description: Detects a specific URL pattern associated with VDO.Ninja screen sharing. This technique has been observed being used by DPRK-aligned operatives (FAMOUS CHOMILLA) for exfiltration.
references:
    - https://www.huntress.com/blog/huntress-dprk-remote-worker-investigation
author: ioc-yara-daily (agentic)
date: 2024-05-23
tags:
    - attack.exfiltration
    - attack.t1567.002
logsource:
    category: proxy
detection:
    selection:
        DestinationHostname|endswith: 'vdo.ninja'
        Url|contains|all:
            - '/?'
            - 'push='
            - 'screenshare'
            - 'label='
    condition: selection
falsepositives:
    - Legitimate use of VDO.Ninja for screen sharing, as it is a public service.
level: medium
