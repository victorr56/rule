title: Citrus GPO Deployment Script Execution
id: 17b1ff40-02d9-43a7-b248-b0a649377673
status: experimental
description: Detects the execution of a PowerShell script used for malicious GPO deployment, typically dropped from a 7-Zip self-extracting archive. This TTP was used by the Citrus group.
references:
    - https://securelist.com/citrus-ransomware/121879/
author: ioc-yara-daily (agentic)
date: 2024-06-25
tags:
    - attack.lateral_movement
    - attack.t1484.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - '\AppData\Local\Temp\7ZipSfx.'
            - '\Deploy-KasperskyGPO.ps1'
    condition: selection
falsepositives:
    - Unlikely
level: high
