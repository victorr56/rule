title: Citrus Group Scheduled Task Creation
id: c3efc436-b108-466d-961f-13768e734cce
status: experimental
description: Detects the creation of scheduled tasks with names used by the Citrus group for persistence and execution.
references:
    - https://securelist.com/citrus-ransomware/121879/
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.persistence
    - attack.t1053.005
    - attack.execution
logsource:
    category: process_creation
    product: windows
detection:
    selection_base:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/tn'
    selection_name_1:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: 'KasperskyAgentInstallTask'
    selection_name_2:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: 'Sysvc'
    selection_name_3:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: 'Java rpchost agent'
    selection_name_4:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: 'sIErKswD'
    condition: selection_base and 1 of selection_name_*
falsepositives:
    - Legitimate software creating a task with a similar name (e.g., a real Kaspersky agent).
level: high
