title: Lazarus RustyAttr Lure File Creation
id: 5418b760-b97c-48c0-bc62-3eb65c4cd9dd
status: experimental
description: Detects the creation of ZIP files with names used as lures by the Lazarus group in RustyAttr campaigns.
references:
    - https://www.group-ib.com/blog/stealthy-attributes-of-apt-lazarus/
author: ioc-yara-daily (agentic)
date: 2024-05-23
tags:
    - attack.initial_access
    - attack.t1566.001
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'
            - '\brave.exe'
            - '\opera.exe'
            - '\iexplore.exe'
            - '\outlook.exe'
            - '\thunderbird.exe'
        TargetFilename|endswith:
            - 'Dedicated Pdf Viewer.zip'
            - 'Voov meeting (portable).zip'
    condition: selection
falsepositives:
    - Legitimate files with these names are unlikely.
level: medium
