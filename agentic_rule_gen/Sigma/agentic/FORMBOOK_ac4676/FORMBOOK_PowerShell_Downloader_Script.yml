title: FORMBOOK PowerShell Downloader Script
id: a0c6441b-43a0-4034-8c80-c0b7da98f804
status: experimental
description: Detects a PowerShell command used by FORMBOOK to download and execute a payload, saving it as "dllhostSvc.exe" in the user's AppData directory.
references:
    - https://www.elastic.co/security-labs/threat-command/formbook-adopts-cab-less-approach
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - '.downloadfile('
            - 'Start-Process'
            - '$env:appdata\dllhostSvc.exe'
    condition: selection
falsepositives:
    - Legitimate scripts are unlikely to download and execute a file named 'dllhostSvc.exe' in this manner.
level: high
