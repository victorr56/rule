title: Rclone Exfiltration to MEGA Cloud Storage
id: b92301c2-127e-4008-8e68-0f7233bb9706
status: experimental
description: Detects the use of rclone to exfiltrate data to MEGA cloud storage, a TTP used by groups like World Leaks.
references:
    - https://www.darktrace.com/blog/when-reality-diverges-from-the-playbook-darktrace-identifies-encryption-in-a-world-leaks-ransomware-attack
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.exfiltration
    - attack.t1567.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rclone.exe'
        CommandLine|contains: 'mega:'
    condition: selection
falsepositives:
    - Legitimate use of rclone to back up or transfer files to a personal or corporate MEGA account.
level: medium
