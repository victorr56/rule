title: World Leaks Ransomware Payload Execution
id: 6a2c300f-31a8-4448-bb8e-4a6c6c7456d2
status: experimental
description: Detects the execution of the World Leaks ransomware payload 'world.exe', often deployed via GPO from the SYSVOL share.
references:
    - https://www.darktrace.com/blog/when-reality-diverges-from-the-playbook-darktrace-identifies-encryption-in-a-world-leaks-ransomware-attack
author: ioc-yara-daily (agentic)
date: 2024-06-13
tags:
    - attack.impact
    - attack.t1486
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\world.exe'
        Image|contains: '\SYSVOL\'
    condition: selection
falsepositives:
    - Unlikely
level: high
