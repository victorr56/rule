title: Aoki Infostealer C2 DNS Queries
id: f3e2d1c8-4b9a-4e8d-9b6c-1a8d7c4e3f2d
status: experimental
description: Detects DNS queries for domains known to be used as C2 servers by the Aoki infostealer.
references:
    - https://www.security.com/threat-intelligence/aoki-infostealer-ai-targeting
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName|endswith:
            - 'dobeqnesmot.cc'
            - 'hjazfioe.surf'
            - 'neihite.cc'
    condition: selection
falsepositives:
    - Unlikely
level: high
