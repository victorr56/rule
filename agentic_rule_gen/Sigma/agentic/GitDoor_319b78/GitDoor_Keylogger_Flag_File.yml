title: GitDoor Keylogger Flag File Creation
id: c5d8ef29-b4b1-4c6e-8211-13c5457cdfdc
status: experimental
description: Detects the creation of the 'log.lock' file in the AppData directory, which is used by GitDoor to enable keylogging.
references:
    - https://securelist.com/operation-shadowcloud-gitdoor/122004/
author: ioc-yara-daily (agentic)
date: 2024-11-20
tags:
    - attack.collection
    - attack.t1056.001
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith: '\AppData\Roaming\log.lock'
        Image|endswith:
            - '\AppData\Roaming\svchost.exe'
            - '\AppData\Roaming\init.exe'
            - '\Microsoft Essentials\Security Essentials.exe'
    condition: selection
falsepositives:
    - Unlikely
level: high
