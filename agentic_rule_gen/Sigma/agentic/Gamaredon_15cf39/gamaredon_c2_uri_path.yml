title: Gamaredon C2 URI Path Observed
id: d7d4d467-5f21-4f32-8df3-4c9103847e70
status: experimental
description: Detects a specific URI path and User-Agent combination used in Gamaredon C2 communications.
references:
    - https://www.elastic.co/security-labs/threat-command/playing-defense-against-gamaredon-group
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection:
        Url|contains: '/posolreboot.php'
        UserAgent: 'Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1; SV1)'
    condition: selection
falsepositives:
    - Unlikely
level: high
