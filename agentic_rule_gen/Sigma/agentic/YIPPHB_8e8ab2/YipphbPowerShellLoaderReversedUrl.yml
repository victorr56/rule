title: YIPPHB PowerShell Loader with Reversed URL Strings
id: 56930263-548c-4a39-9d04-f3a3d538e4a9
status: experimental
description: Detects a PowerShell script associated with the YIPPHB dropper, which contains reversed URL strings used to download subsequent stages.
references:
    - https://www.elastic.co/security-labs/threat-command/doing-time-with-the-yipphb-dropper
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - '/moc.lruynit//:sptth'
            - '/moc.ppadrocsid.ndc//:sptth'
    condition: selection
falsepositives:
    - Legitimate scripts that happen to contain these specific reversed URL fragments.
level: high
