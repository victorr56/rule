title: OfferLoader Staged Payload Execution
id: 59a0f023-e407-42c2-8404-5853b0922896
status: experimental
description: |
    Detects the execution of specifically named payloads from a temporary Inno Setup
    staging directory (%TEMP%\\is-*.tmp\\). This is a core behavior of OfferLoader
    when deploying its monetization payloads.
references:
    - https://www.microsoft.com/en-us/security/blog/2022/11/03/fake-download-campaign-uses-trojanized-installers-to-deliver-monetization-payloads/
author: ioc-yara-daily (agentic)
date: 2022-11-04
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|contains: '\AppData\Local\Temp\is-'
        Image|re: '\\(eld[0-9]+|set_[0-9]+|FirstFast(\[1\])?|SecondRunner(\[1\])?)\.exe$'
    condition: selection
falsepositives:
    - Legitimate Inno Setup installers that happen to unpack and run executables with these specific names (considered unlikely).
level: high
