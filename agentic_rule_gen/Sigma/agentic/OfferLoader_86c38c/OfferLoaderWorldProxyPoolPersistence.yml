title: OfferLoader WorldProxyPool Persistence Task Creation
id: f02058e5-3d84-4861-a065-276e017cdb3c
status: experimental
description: |
    Detects the creation of scheduled tasks with names starting with 'WorldProxyPool',
    which are used by OfferLoader to establish persistence for the WorldProxyPool
    proxyware payload.
references:
    - https://www.microsoft.com/en-us/security/blog/2026/11/03/fake-download-campaign-uses-trojanized-installers-deliver-monetization-payloads/
author: ioc-yara-daily (agentic)
date: 2026-11-04
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/tn'
            - 'WorldProxyPool'
    condition: selection
falsepositives:
    - Unlikely
level: high
