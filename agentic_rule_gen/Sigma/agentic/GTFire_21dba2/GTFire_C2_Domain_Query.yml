title: GTFire C2 Domain Query
id: de539b7d-655f-40e8-8b5e-49b0a68d0ac4
status: experimental
description: Detects DNS queries for domains known to be used as C2 servers by the GTFire campaign.
references:
    - https://www.group-ib.com/blog/gtfire-phishing-scheme-es/
author: ioc-yara-daily (agentic)
date: 2026-10-29
tags:
    - attack.command_and_control
    - attack.t1071
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName|endswith:
            - 'jnhwzs.fyi'
            - 'gnpnia.lat'
    condition: selection
falsepositives:
    - Unlikely
level: critical
