title: Yoba Loader DLL Dropped for Sideloading
id: 11c62f2c-e161-4560-af30-8c298083a21e
status: experimental
description: Detects the creation of the Yoba loader DLL 'wmpdui.dll' by its dropper 'Imagine-xt-pro.exe'.
references:
    - https://research.checkpoint.com/2024/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
author: ioc-yara-daily (agentic)
date: 2024-05-29
tags:
    - attack.defense_evasion
    - attack.persistence
    - attack.t1574.002
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\Imagine-xt-pro.exe'
        TargetFilename|endswith: '\ProgramData\WMProcess\wmpdui.dll'
    condition: selection
falsepositives:
    - Unlikely
level: high
