title: Yoba Malware Persistence via Scheduled Task
id: 593a8d9b-d75d-408c-8514-6338bce674f7
status: experimental
description: Detects the creation of a scheduled task with a specific description used by YobaDropper for persistence.
references:
    - https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
author: ioc-yara-daily (agentic)
date: 2026-10-28
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053.005
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/d'
            - 'Collects device metadata for Windows Media Player.'
    condition: selection
falsepositives:
    - Unlikely
level: high
