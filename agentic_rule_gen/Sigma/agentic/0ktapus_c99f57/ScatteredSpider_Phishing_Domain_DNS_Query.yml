title: Scattered Spider/0ktapus Phishing Domain DNS Query
id: 48e9d3de-14ec-4074-a09c-30c885871fde
status: experimental
description: Detects DNS queries for domains known to be used in 0ktapus/Scattered Spider phishing campaigns.
references:
    - https://www.wiz.io/blog/unmasking-phishing-strategies-for-identifying-0ktapus-domains
author: ioc-yara-daily (agentic)
date: 2026-10-25
tags:
    - attack.initial_access
    - attack.t1566.002
logsource:
    product: windows
    category: dns_query
detection:
    selection:
        QueryName|endswith:
            - '.revolut-ticket.com'
            - '.gemini-sso.com'
            - '.dashboard-mailgun.com'
            - '.mgmresorts-okta.com'
            - '.calendar-dd.com'
            - '.t-mobile-okta.com'
            - '.nike-support.com'
            - '.doordash-support.com'
    condition: selection
falsepositives:
    - These domains may be taken down or re-registered for benign purposes in the future.
level: high
