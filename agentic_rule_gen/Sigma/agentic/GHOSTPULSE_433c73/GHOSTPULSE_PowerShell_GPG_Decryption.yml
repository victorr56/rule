title: GHOSTPULSE GPG Decryption Process
id: 11d33edb-01a7-4df3-a15d-de0e599b4ffc
status: experimental
description: Detects the GPG decryption process spawned by the GHOSTPULSE PowerShell loader. The loader uses a hardcoded passphrase and pipes it to a bundled GPG executable.
references:
    - https://www.elastic.co/security-labs/threat-command/ghostpulse-haunts-victims-using-defense-evasion-bag-o-tricks
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.defense_evasion
    - attack.t1140
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\gpg.exe'
        ParentImage|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - '--passphrase-fd 0'
            - '--decrypt'
            - '--output'
    condition: selection
falsepositives:
    - Legitimate administrative scripts may use GPG in a similar manner, but it is uncommon.
level: high
