title: Lazarus Group Toolset Process Creation
id: c6f5a34e-48f1-438a-8a5f-d232c19f1eb1
status: experimental
description: Detects the execution of various tools from the Lazarus Group's malware suite by their specific process names.
references:
    - https://www.group-ib.com/blog/lazarus/
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.execution
    - attack.command_and_control
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_server_rat:
        Image|endswith: '\Server_RAT.exe'
        CommandLine|contains: 'Server_RAT.exe'
    selection_server_tf:
        Image|endswith: '\Server_TrafficForwarder.exe'
        CommandLine|contains: 'Server_TrafficForwarder.exe'
    selection_client_tf:
        Image|endswith: '\Client_TrafficForwarder.exe'
        CommandLine|contains: 'Client_TrafficForwarder.exe'
    selection_backend_listener:
        Image|endswith: '\Backend_Listener.exe'
        CommandLine|contains: 'Backend_Listener.exe'
    selection_admin_tool:
        Image|endswith: '\Admin_Tool.exe'
        CommandLine|contains: 'Admin_Tool.exe'
    selection_client_rat:
        Image|endswith: '\Client_RAT.exe'
        CommandLine|contains: 'Client_RAT.exe'
    selection_recon:
        Image|endswith: '\Recon.exe'
        CommandLine|contains: 'Recon.exe'
    selection_loader:
        Image|endswith: '\Loader.exe'
        CommandLine|contains: 'Loader.exe'
    condition: 1 of selection_*
falsepositives:
    - Unlikely
level: critical
