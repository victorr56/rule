title: NOVABLIGHT - Windows Recovery Environment Sabotage
id: 3c5e88ac-3fdc-4a33-875f-dfc493c0dae8
status: experimental
description: Detects the command to disable the Windows Recovery Environment (WinRE), a technique used by NOVABLIGHT for system sabotage.
references:
    - https://www.elastic.co/security-labs/threat-command/maas-appeal-an-infostealer-rises-from-the-ashes
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.defense_evasion
    - attack.t1562.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\reagentc.exe'
        CommandLine|contains: ' /disable'
    condition: selection
falsepositives:
    - Legitimate use by administrators to manage the Windows Recovery Environment, although disabling it is uncommon and warrants investigation.
level: high
