title: KANDYKORN In-Memory Mach-O Loading Artifact on macOS
id: 59a1f592-36c1-419b-ab0a-3c1a2f643e99
status: experimental
description: Detects the creation of a temporary file with a predictable name pattern, a side effect of KANDYKORN's in-memory Mach-O loading technique, when created by a process also running from the /tmp directory.
references:
    - https://www.elastic.co/security-labs/threat-command/elastic-catches-dprk-passing-out-kandykorn
author: ioc-yara-daily (agentic)
date: 2024-05-22
tags:
    - attack.defense_evasion
    - attack.t1027.002
    - detection.threat_hunting
logsource:
    category: file_event
    product: macos
detection:
    selection:
        Image|startswith: '/tmp/'
        TargetFilename|startswith: '/tmp/NSCreateObjectFileImageFromMemory-'
    condition: selection
falsepositives:
    - Legitimate software that runs from the /tmp directory and uses the private NSCreateObjectFileImageFromMemory API, which is highly unlikely.
level: high
