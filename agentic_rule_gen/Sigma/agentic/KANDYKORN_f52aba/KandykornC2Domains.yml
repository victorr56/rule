title: KANDYKORN and Lazarus Group C2 DNS Query
id: 593798aa-a1e6-42d6-8fd7-8b01a1f0f04f
status: experimental
description: Detects DNS queries for domains associated with KANDYKORN and related Lazarus Group C2 infrastructure.
references:
    - https://www.elastic.co/security-labs/threat-command/elastic-catches-dprk-passing-out-kandykorn
author: ioc-yara-daily (agentic)
date: 2026-10-18
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName:
            - 'tp-globa.xyz'
            - 'bitscrunnch.linkpc.net'
            - 'jobintro.linkpc.net'
            - 'coupang-networks.pics'
            - 'pesnam.publicvm.com'
            - 'group.pro-tokyo.top'
    condition: selection
falsepositives:
    - Unlikely
level: high
