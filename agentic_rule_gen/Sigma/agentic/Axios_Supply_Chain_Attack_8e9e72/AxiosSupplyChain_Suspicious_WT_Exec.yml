title: Axios Supply Chain Attack Suspicious wt.exe Execution
id: c4d3b2a1-f0e9-48c7-b6a5-9b8c7d6e5a4b
status: experimental
description: Detects the execution of "wt.exe" from the non-standard "ProgramData" directory, as seen in the Axios supply chain attack.
references:
    - https://www.wiz.io/blog/axios-npm-compromised-in-supply-chain-attack
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense_evasion
    - attack.t1036.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\ProgramData\wt.exe'
        ParentImage|endswith: '\powershell.exe'
    condition: selection
falsepositives:
    - Legitimate administrative or software deployment scripts that install or execute Windows Terminal from C:\ProgramData.
level: high
