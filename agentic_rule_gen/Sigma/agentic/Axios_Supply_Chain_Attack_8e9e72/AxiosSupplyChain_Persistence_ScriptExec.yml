title: Axios Supply Chain Attack Persistence Script Execution
id: e2b8a7f1-5d9c-4e8b-b1a0-9c8d7e6f5a4b
status: experimental
description: Detects the execution of the persistence batch script "system.bat" from the ProgramData folder, a behavior associated with the Axios supply chain attack.
references:
    - https://www.wiz.io/blog/axios-npm-compromised-in-supply-chain-attack
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.t1547.001
    - attack.execution
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmd.exe'
        CommandLine|contains: '\ProgramData\system.bat'
    condition: selection
falsepositives:
    - Legitimate administrative batch scripts named "system.bat" located in the ProgramData folder.
level: medium
