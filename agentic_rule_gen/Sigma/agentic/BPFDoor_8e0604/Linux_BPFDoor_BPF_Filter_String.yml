title: Linux BPFDoor BPF Filter String in Command Line
id: 54109726-14ab-4509-906d-4702958f27fa
status: experimental
description: Detects the presence of the BPFDoor's unique BPF filter string in a process command line, often used with tools like tcpdump or tshark for analysis or setup. This filter is used to passively listen for a "magic packet" to activate the backdoor.
references:
    - https://www.elastic.co/security-labs/threat-command/a-peek-behind-the-bpfdoor
author: ioc-yara-daily (agentic)
date: 2024-06-25
tags:
    - attack.command_and_control
    - attack.defense_evasion
    - attack.t1205.002
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith:
            - '/tcpdump'
            - '/tshark'
        CommandLine|contains:
            - 'tcp[((tcp[12]&0xf0)>>2):2]=0x5293'
            - '(udp[8:2]=0x7255)'
            - '(icmp[8:2]=0x7255)'
    condition: selection
falsepositives:
    - Unlikely
level: critical
