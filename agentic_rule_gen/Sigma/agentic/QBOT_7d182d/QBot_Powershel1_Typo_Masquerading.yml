title: QBot PowerShell Masquerading With Typo
id: 5a4a58b8-d216-43e5-8f6a-f112e4f0d7e5
status: experimental
description: Detects process creation events involving 'powershel1.exe' (with a '1'), a specific typo used by QBot to masquerade as the legitimate PowerShell executable.
references:
    - https://www.elastic.co/security-labs/blog/qbot-configuration-extractor
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.defense_evasion
    - attack.t1036.005
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershel1.exe'
        OriginalFileName: 'powershell.exe'
    condition: selection
falsepositives:
    - Legitimate software is highly unlikely to be named 'powershel1.exe' and have 'powershell.exe' as its PE original filename.
level: critical
