title: EstateRansomware Payload Execution in PerfLogs
id: 58872658-00a4-44ac-aa06-f6dd62ac8b48
status: experimental
description: 'Detects the execution of the EstateRansomware payload "LB3.exe" from the "C:\PerfLogs" directory. In the observed attacks, this was initiated via PsExec.'
references:
    - https://www.group-ib.com/blog/estate-ransomware/
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.impact
    - attack.t1486
    - attack.execution
    - attack.t1569.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\PerfLogs\LB3.exe'
        ParentImage|endswith: '\PSEXESVC.EXE'
    condition: selection
falsepositives:
    - 'Legitimate use of PsExec to run a program named LB3.exe from C:\PerfLogs, which is highly unlikely.'
level: critical
