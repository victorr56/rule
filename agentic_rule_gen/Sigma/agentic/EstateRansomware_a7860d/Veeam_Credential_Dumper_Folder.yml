title: Potential Veeam Credential Dumper Tool Folder Creation
id: dde856f6-49f3-42e7-9d7a-75bde14407b4
status: experimental
description: Detects the creation of a folder named "veeam-creds-main", which is characteristic of the "sadshade/veeam-creds" credential dumping tool used by the EstateRansomware group. This folder is typically created when extracting the tool from a zip archive downloaded from its GitHub repository.
references:
    - https://www.group-ib.com/blog/estate-ransomware/
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.credential_access
    - attack.t1552.001
    - detection.threat_hunting
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith: '\veeam-creds-main'
        Image|endswith:
            - '\7z.exe'
            - '\7za.exe'
            - '\WinRAR.exe'
            - '\tar.exe'
    condition: selection
falsepositives:
    - Legitimate administrative or security testing activity involving the download and extraction of this tool from its source repository.
level: high
