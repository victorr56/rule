title: Nirsoft Credential Dumping Tool Execution
id: 15309a47-f07d-419b-a3da-f6c6d0426b3c
status: experimental
description: Detects the execution of several Nirsoft utilities with command-line arguments to dump credentials to a file. This non-interactive use is highly indicative of malicious activity. These tools were leveraged by the EstateRansomware group.
references:
    - https://www.group-ib.com/blog/estate-ransomware/
    - https://www.nirsoft.net/utils/chromepass.html
    - https://www.nirsoft.net/utils/web_browser_password.html
    - https://www.nirsoft.net/utils/mail_passview.html
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.credential_access
    - attack.t1555
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\ChromePass.exe'
            - '\WebBrowserPassView.exe'
            - '\mailpv.exe'
        CommandLine|contains:
            - '/stext '
            - '/scomma '
            - '/shtml '
            - '/sjson '
    condition: selection
falsepositives:
    - Unlikely, as the rule requires command-line arguments for non-interactive dumping. Legitimate use of these tools is typically interactive.
level: high
