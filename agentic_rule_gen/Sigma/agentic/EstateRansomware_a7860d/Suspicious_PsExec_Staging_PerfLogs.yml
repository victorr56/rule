title: Suspicious PsExec Execution from PerfLogs Directory
id: a21b068a-c603-49d7-89e9-b5eb1b789966
status: experimental
description: Detects the execution of PsExec from the "C:\PerfLogs" directory. While PsExec is a legitimate tool, its presence in this directory is a common staging technique for attackers, including the EstateRansomware group, for lateral movement.
references:
    - https://www.group-ib.com/blog/estate-ransomware/
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.execution
    - attack.t1021.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\PerfLogs\PsExec.exe'
        CommandLine|contains: '\\'
    condition: selection
falsepositives:
    - Legitimate administrative activity, though staging PsExec in PerfLogs is unusual.
level: high
