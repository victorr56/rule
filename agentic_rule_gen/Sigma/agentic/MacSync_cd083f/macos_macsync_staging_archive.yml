title: MacSync Data Staging with Zip
id: 9781f3d4-b778-45b9-91a7-cc257d07963d
status: experimental
description: Detects the execution of the 'zip' command to create an archive named 'osalogging.zip' in the /tmp directory, a behavior associated with the MacSync malware for data staging.
references:
    - https://securelist.com/macsync-new-version/121383/
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.collection
    - attack.t1560.001
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/usr/bin/zip'
        CommandLine|contains: '/tmp/osalogging.zip'
    condition: selection
falsepositives:
    - Legitimate use of zip to create an archive with this specific name and path, which is unlikely.
level: high
