title: Remote Script Execution via Pipe to Interpreter
id: 97891e4a-4467-4228-b0a5-115f0d2ba225
status: experimental
description: Detects the common pattern of downloading a script with curl or wget and piping it directly to a shell or other interpreter for execution. This is a frequent technique for initial access and payload delivery.
references:
    - https://www.elastic.co/security-labs/threat-command/detecting-cicd-pipeline-abuse-with-llm-augmented-analysis
author: ioc-yara-daily (agentic)
date: 2024-05-27
tags:
    - attack.t1059.004
    - attack.t1195.002
    - detection.threat_hunting
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith:
            - '/curl'
            - '/wget'
        CommandLine|re: '\s\|\s+((/bin/)?sh|(/usr/bin/)?bash|(/usr/bin/)?node)\b'
    condition: selection
falsepositives:
    - Legitimate software installation scripts, especially in container build files or developer bootstrapping scripts.
level: medium
