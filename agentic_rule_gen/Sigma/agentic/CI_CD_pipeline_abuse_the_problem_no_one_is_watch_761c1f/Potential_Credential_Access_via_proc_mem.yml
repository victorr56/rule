title: Potential Credential Access via /proc/mem on Command Line
id: 457a4141-9a74-4b52-949e-cc1dd3852033
status: experimental
description: Detects utilities reading from /proc/mem via command line arguments. This may indicate an attempt to scrape credentials from memory, a technique used by adversaries, especially in containerized or shared runner environments.
references:
    - https://www.elastic.co/security-labs/threat-command/detecting-cicd-pipeline-abuse-with-llm-augmented-analysis
author: ioc-yara-daily (agentic)
date: 2024-06-25
tags:
    - attack.t1552.004
    - attack.t1003
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith:
            - '/egrep'
            - '/fgrep'
            - '/hexdump'
            - '/strings'
        CommandLine|contains: ' /proc/mem'
    condition: selection
falsepositives:
    - Legitimate administrative or debugging activity involving memory inspection, which should be rare and is worth investigating.
level: high
