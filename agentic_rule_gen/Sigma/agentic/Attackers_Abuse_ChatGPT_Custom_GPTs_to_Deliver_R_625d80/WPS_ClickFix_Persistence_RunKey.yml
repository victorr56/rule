title: ClickFix RAT Persistence via Run Key
id: 2b3c4d5e-7a8b-4c5d-8e9f-0a1b2c3d4e5f
status: experimental
description: Detects the creation of persistence registry values in 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' by the ClickFix RAT.
references:
    - https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.t1547.001
    - attack.persistence
logsource:
    category: registry_set
    product: windows
detection:
    selection_v1:
        TargetObject|endswith: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\Canon Configuration Reader'
        Details|contains|all:
            - '\Programs\Advanced Printer Configuration Reader\'
            - 'COTFileReadApp.exe'
    selection_v2:
        TargetObject|endswith: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\Stardock DeElevation Tool'
        Details|contains|all:
            - '\Programs\Stardock Smart DeElevation Tool\'
            - 'DeElevate64.exe'
    condition: 1 of selection_*
falsepositives:
    - Unlikely
level: high
