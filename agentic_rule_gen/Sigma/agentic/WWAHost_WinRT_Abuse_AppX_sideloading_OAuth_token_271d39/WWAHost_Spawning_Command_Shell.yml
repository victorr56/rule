title: WWAHost Spawning Command Shell
id: 489f7f45-0d26-4444-a957-3de4f981dd46
status: experimental
description: Detects the Windows Web App Host process (WWAHost.exe) spawning a command shell (cmd.exe or powershell.exe). This is highly anomalous and may indicate code execution breakout from a malicious AppX package.
references:
    - https://www.huntress.com/blog/stealing-oauth-tokens-through-microsofts-front-door
author: ioc-yara-daily (agentic)
date: 2024-05-23
tags:
    - attack.t1528
    - attack.t1550.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_cmd:
        ParentImage|endswith: '\WWAHost.exe'
        Image|endswith: '\cmd.exe'
    selection_ps:
        ParentImage|endswith: '\WWAHost.exe'
        Image|endswith: '\powershell.exe'
    selection_pwsh:
        ParentImage|endswith: '\WWAHost.exe'
        Image|endswith: '\pwsh.exe'
    condition: 1 of selection_*
falsepositives:
    - Unlikely. WWAHost.exe is a web app host and should not be spawning shells.
level: critical
