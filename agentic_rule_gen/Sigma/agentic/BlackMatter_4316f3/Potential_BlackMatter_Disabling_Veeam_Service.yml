title: Potential BlackMatter Activity Disabling Veeam Service
id: 9d877a21-c350-482a-a922-90299f13e735
status: experimental
description: Detects attempts to stop Veeam backup services, a common precursor activity for ransomware like BlackMatter, to prevent data recovery.
references:
    - https://www.group-ib.com/blog/blackmatter-ransomware/
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.impact
    - attack.t1489
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\net.exe'
            - '\sc.exe'
        CommandLine|contains:
            - ' stop Veeam'
            - ' stop "Veeam'
    condition: selection
falsepositives:
    - Legitimate administrative activity, such as during software updates or system maintenance.
level: medium
