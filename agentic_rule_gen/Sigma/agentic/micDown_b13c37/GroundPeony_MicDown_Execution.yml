title: GroundPeony MicDown Execution From Staging Directory
id: 1a5e11f1-3094-4d2c-87b6-f87c9d96ec37
status: experimental
description: Detects the execution of 'mic.exe' from its staging directory 'C:\ProgramData\mic\', typically spawned by one of the initial droppers.
references:
    - http://nao-sec.org/2023/08/groundpeony-crawling-with-malice.html
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.execution
    - attack.t1203
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image: 'C:\ProgramData\mic\mic.exe'
        ParentImage|endswith:
            - '\Install.exe'
            - '\系統安全補丁.exe' # System Security Patch.exe
    condition: selection
falsepositives:
    - Unlikely
level: high
