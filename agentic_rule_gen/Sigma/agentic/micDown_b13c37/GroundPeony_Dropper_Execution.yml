title: GroundPeony Dropper Execution
id: c5d6b840-a359-4721-a53d-24ed897d10c0
status: experimental
description: Detects the execution of a GroundPeony dropper with a specific filename, typically from a user's temporary or download directory.
references:
    - http://nao-sec.org/2023/08/groundpeony-crawling-with-malice.html
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.initial_access
    - attack.t1566.001
    - detection.threat_hunting
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\系統安全補丁.exe' # System Security Patch.exe
        Image|startswith:
            - 'C:\Users\'
            - 'C:\Documents and Settings\'
    condition: selection
falsepositives:
    - Other malware or legitimate tools using a similar naming convention.
level: medium
