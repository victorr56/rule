title: GopherWhisper Loader 'FriendDelivery.dll' Loaded
id: c62f592f-5374-4b55-a010-863a35a63901
status: experimental
description: Detects the loading of 'FriendDelivery.dll'. This DLL is a loader and injector for the BoxOfFriends backdoor, part of the GopherWhisper toolset.
references:
    - https://www.welivesecurity.com/en/eset-research/gopherwhisper-burrow-full-malware/
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.execution
    - attack.t1204.002
    - detection.threat_hunting
logsource:
    category: image_load
    product: windows
detection:
    selection:
        ImageLoaded|endswith: '\FriendDelivery.dll'
        Image|startswith:
            - 'C:\Users\'
            - 'C:\ProgramData\'
            - 'C:\Windows\Temp\'
    condition: selection
falsepositives:
    - Unlikely
level: high
