title: BADIIS Service Security Descriptor Modification
id: 5a8a688b-871d-44a7-87c2-1c0b36e9d29f
status: experimental
description: Detects the modification of the "WalletServiceInfo" service's security descriptor, a specific behavior of the BADIIS malware installer. This command is executed to configure the permissions for the newly created malicious service.
references:
    - https://www.elastic.co/security-labs/threat-command/badiis-to-the-bone-new-insights-to-global-seo-poisoning-campaign
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.persistence
    - attack.t1543.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\sc.exe'
        CommandLine|contains|all:
            - 'sdset'
            - 'WalletServiceInfo'
            - 'D:(D;;DCLCWPDTSD;;;IU)(D;;DCLCWPDTSD;;;SU)(D;;DCLCWPDTSD;;;BA)' # This SDDL string is highly specific to this threat
    condition: selection
falsepositives:
    - Unlikely
level: high
