title: BADIIS SEO Poisoning Content Request
id: e0d9c4e2-a7d1-4b1a-8c7c-6d8b3a7e4d8e
status: experimental
description: Detects HTTP requests to URI paths used by BADIIS malware to fetch SEO poisoning content, backlinks, and configuration files.
references:
    - https://www.elastic.co/security-labs/threat-command/badiis-to-the-bone-new-insights-to-global-seo-poisoning-campaign
author: ioc-yara-daily (agentic)
date: 2024-06-21
tags:
    - attack.command_and_control
    - attack.t1102
logsource:
    category: proxy
detection:
    selection_php:
        Url|endswith: '/lunlian/index.php'
        Method: 'POST'
    selection_txt:
        Url|endswith:
            - 'fmlip.txt'
            - 'fmltz.txt'
            - 'fmllj.txt'
            - 'fmldz.txt'
        Method: 'GET'
    condition: 1 of selection_*
falsepositives:
    - Unlikely
level: high
