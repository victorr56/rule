title: Diicot Malware OpenSSH Scan Result Parsing
id: 48937085-f529-45e0-8fa5-79ac4e565983
status: experimental
description: Detects a specific shell command chain used by the Diicot malware to parse the results of its SSH banner grabbing scan, filtering for unique IPs running OpenSSH.
references:
    - https://www.wiz.io/blog/diicot-threat-group-malware-campaign
author: ioc-yara-daily (agentic)
date: 2026-10-24
tags:
    - attack.collection
    - attack.t1119
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith:
            - '/sh'
            - '/bash'
        CommandLine|contains|all:
            - 'cat /var/tmp/.update-logs/banner.log'
            - 'grep -a OpenSSH'
            - 'uniq > /var/tmp/.update-logs/fenta'
    condition: selection
falsepositives:
    - Unlikely
level: high
