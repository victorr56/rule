title: MuddyWater VBS Execution from ProgramData
id: 7906d289-543e-4375-b82b-8a19234b3f23
status: experimental
description: Detects the execution of a VBScript file from the "C:\ProgramData" directory, a TTP observed in MuddyWater campaigns.
references:
    - https://www.group-ib.com/blog/muddywater-infrastructure/
author: ioc-yara-daily (agentic)
date: 2026-10-22
tags:
    - attack.execution
    - attack.t1059.005
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection_wscript:
        Image|endswith: '\wscript.exe'
        CommandLine|contains|all:
            - '\programdata\'
            - '.vbs'
    selection_cscript:
        Image|endswith: '\cscript.exe'
        CommandLine|contains|all:
            - '\programdata\'
            - '.vbs'
    condition: 1 of selection_*
falsepositives:
    - Legitimate administrative or software installation scripts may execute VBS from this location, requiring investigation.
level: medium
