title: Qlik Sense Fingerprinting via .ttf Bypass (CVE-2023-41265)
id: 3c629237-775b-437d-b3ef-80f08a40590a
status: experimental
description: Detects attempts to fingerprint a Qlik Sense server by requesting product-info.json with a .ttf extension in the query string to bypass access controls. This is associated with Cactus ransomware exploitation.
references:
    - https://blog.fox-it.com/2024/04/25/sifting-through-the-spines-identifying-potential-cactus-ransomware-victims/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.t1190
    - detection.threat_hunting
logsource:
    category: proxy
detection:
    selection:
        Url.Path|endswith: '/resources/autogenerated/product-info.json'
        Url.Query|endswith: '.ttf'
    condition: selection
falsepositives:
    - Unlikely
level: high
