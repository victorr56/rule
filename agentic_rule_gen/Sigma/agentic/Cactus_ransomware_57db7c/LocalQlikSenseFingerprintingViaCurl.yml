title: Local Qlik Sense Fingerprinting via Curl
id: d760f381-80a6-444f-8646-77876a380992
status: experimental
description: Detects the local execution of curl to fingerprint a Qlik Sense server, a technique observed in Cactus ransomware intrusions.
references:
    - https://blog.fox-it.com/2024/04/25/sifting-through-the-spines-identifying-potential-cactus-ransomware-victims/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.t1190
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\curl.exe'
        CommandLine|contains|all:
            - 'Host: localhost'
            - 'product-info.json?.ttf'
    condition: selection
falsepositives:
    - Unlikely
level: high
