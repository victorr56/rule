title: NetamLoader DLL Sideloading
id: 3c8e9f21-72a3-4b67-850f-21f7c320d36b
status: experimental
description: Detects the loading of a malicious 'fabric.dll' by 'PatchMyPC-ScriptRunner.exe' from the SoftwareDistribution directory, a DLL Sideloading technique used by NetamLoader.
references:
    - https://securelist.com/netamloader/121676/
author: ioc-yara-daily (agentic)
date: 2024-05-23
tags:
    - attack.execution
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1574.002
logsource:
    category: image_load
    product: windows
detection:
    selection:
        Image|endswith: '\SoftwareDistribution\Download\Install\PatchMyPC-ScriptRunner.exe'
        ImageLoaded|endswith: '\SoftwareDistribution\Download\Install\fabric.dll'
    condition: selection
falsepositives:
    - Unlikely. While PatchMyPC is a legitimate tool, the combination of it running from this path and loading this specific DLL is highly indicative of compromise.
level: high
