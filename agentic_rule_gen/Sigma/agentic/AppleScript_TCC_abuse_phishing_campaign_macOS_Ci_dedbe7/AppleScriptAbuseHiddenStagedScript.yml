title: AppleScript TCC-Abuse Hidden Stage Execution
id: f450259b-c4f5-46aa-83a3-d7373f1d8c18
status: experimental
description: |
    Detects the execution of a hidden AppleScript file named '.ex.scpt' in the user's home directory.
    This is the name of the second-stage script dropped and executed by the macOS phishing campaign.
references:
    - https://www.darktrace.com/blog/applescript-abuse-unpacking-a-macos-phishing-campaign
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.execution
    - attack.t1059.002
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/usr/bin/osascript'
        CommandLine|contains: '/.ex.scpt'
    condition: selection
falsepositives:
    - Unlikely. The combination of 'osascript' and a hidden script with this specific name is highly suspicious.
level: high
