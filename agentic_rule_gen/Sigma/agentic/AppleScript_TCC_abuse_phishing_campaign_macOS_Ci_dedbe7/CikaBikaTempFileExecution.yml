title: CikaBika Bot PowerShell-Dropped Loader Execution
id: 61e05d05-4f40-4228-86d4-d50d03274df7
status: experimental
description: |
    Detects the execution of the CikaBika loader 'IfyuUapz.txt' from the temporary directory by 'cmd.exe', spawned by 'powershell.exe'.
    This corresponds to the final step of the initial LNK/PowerShell execution chain.
references:
    - https://www.darktrace.com/blog/applescript-abuse-unpacking-a-macos-phishing-campaign
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.execution
    - attack.t1059.003
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\powershell.exe'
        Image|endswith: '\cmd.exe'
        CommandLine|contains: 'IfyuUapz.txt'
    condition: selection
falsepositives:
    - Unlikely. This specific process chain and command line argument are characteristic of the malware.
level: high
