title: AppleScript TCC-Abuse Credential Validation with dscl
id: cbca022c-a28a-40a2-b91c-7704cc0f3c5f
status: experimental
description: |
    Detects the use of 'dscl' with '-authonly' to validate user credentials without a full login.
    This technique was observed in a macOS phishing campaign to check harvested credentials.
references:
    - https://www.darktrace.com/blog/applescript-abuse-unpacking-a-macos-phishing-campaign
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.credential_access
    - attack.t1553.006
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/usr/bin/dscl'
        CommandLine|contains|all:
            - '/Search'
            - '-authonly'
    condition: selection
falsepositives:
    - Legitimate but rare administrative activity for credential validation.
level: high
