title: MacSync Password Validation with DSCL
id: c46d2466-9b51-419b-ab00-e90f23f03b60
status: experimental
description: Detects MacSync attempting to validate a captured user password without a full login session by using the 'dscl . authonly' command.
references:
    - https://www.huntress.com/blog/macsync-stealer-rat-reverse-engineering
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.credential_access
    - attack.t1552.001
logsource:
    product: macos
    category: process_creation
detection:
    selection:
        Image|endswith: '/usr/bin/dscl'
        CommandLine|contains: '. authonly'
    condition: selection
falsepositives:
    - Unlikely
level: high
