title: MacSync Data Archiving with Ditto
id: 3c5e8c25-3b95-46c5-af4e-da2ffaf0e54d
status: experimental
description: Detects the command line used by the MacSync stealer's AppleScript component to archive stolen data into '/tmp/osalogging.zip' using the 'ditto' utility.
references:
    - https://www.huntress.com/blog/macsync-stealer-rat-reverse-engineering
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.collection
    - attack.t1560.001
logsource:
    product: macos
    category: process_creation
detection:
    selection:
        Image|endswith: '/usr/bin/ditto'
        CommandLine|contains|all:
            - '--sequesterRsrc'
            - '/tmp/osalogging.zip'
    condition: selection
falsepositives:
    - Unlikely
level: high
