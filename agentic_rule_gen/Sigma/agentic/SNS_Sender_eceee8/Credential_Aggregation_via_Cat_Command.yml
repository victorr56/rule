title: Credential Aggregation via Cat Command
id: 3c2c77d9-c081-430c-ab2e-5034c4fef94c
status: experimental
description: Detects the use of the 'cat' command to aggregate credentials from common locations into a single temporary file for staging before exfiltration.
references:
    - https://www.elastic.co/security-labs/threat-command/aws-sns-abuse
author: ioc-yara-daily (agentic)
date: 2026-10-27
tags:
    - attack.collection
    - attack.t1005
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith: '/cat'
        CommandLine|contains|all:
            - '.github/credentials'
            - 'project.env'
            - '/tmp/stolen_creds.txt'
    condition: selection
falsepositives:
    - A developer could theoretically run a similar command for legitimate purposes, but the exact combination is unlikely.
level: medium
