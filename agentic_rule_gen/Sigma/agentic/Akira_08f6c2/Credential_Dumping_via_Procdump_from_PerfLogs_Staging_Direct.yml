title: Credential Dumping via Procdump from PerfLogs Staging Directory
id: 61ef55f5-f126-476a-93a5-515438a2e55d
status: experimental
description: Detects the execution of 'procdump.exe' from the 'C:\PerfLogs' directory to dump the LSASS process memory. This indicates credential access attempts from a non-standard staging location associated with Akira affiliate activity.
references:
    - https://www.huntress.com/blog/mapping-akira-ransomware-attack
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\PerfLogs\procdump.exe'
        CommandLine|contains: 'lsass'
    condition: selection
falsepositives:
    - Unlikely, as procdump should not typically be run from this directory against LSASS.
level: high
