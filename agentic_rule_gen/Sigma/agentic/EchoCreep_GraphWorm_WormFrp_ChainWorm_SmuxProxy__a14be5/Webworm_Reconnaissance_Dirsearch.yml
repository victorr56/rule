title: Webworm Reconnaissance Using Dirsearch
id: d8f44d1e-1a2c-4b53-8d69-c6e75a34e02f
status: experimental
description: Detects the use of the 'dirsearch' tool with a specific set of excluded status codes, as observed in the command history of a Webworm operator.
references:
  - https://www.welivesecurity.com/en/eset-research/webworm-new-burrowing-techniques/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
  - attack.reconnaissance
  - attack.t1595.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\dirsearch.exe'
      - '\dirsearch'
    CommandLine|contains: '-x 403,404,400,402,401,405,500,503'
  condition: selection
falsepositives:
  - Legitimate use of the dirsearch tool by penetration testers or security researchers.
level: medium
