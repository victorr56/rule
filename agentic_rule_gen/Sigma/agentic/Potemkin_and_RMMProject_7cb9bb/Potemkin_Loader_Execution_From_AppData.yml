title: Potemkin Loader Execution From AppData
id: 55416035-c419-4b68-80f0-c5ddf6eb7e31
status: experimental
description: Detects the execution of the Potemkin loader from its specific installation path 'AppData\Local\Microsoft\RunSearch\RunSearch.exe'. The binary also uses the file description 'RunSearch'.
references:
    - https://www.huntress.com/blog/potemkin-loader-rmmproject-clickfix-attack
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\AppData\Local\Microsoft\RunSearch\RunSearch.exe'
        Description: 'RunSearch'
    condition: selection
falsepositives:
    - Unlikely
level: high
