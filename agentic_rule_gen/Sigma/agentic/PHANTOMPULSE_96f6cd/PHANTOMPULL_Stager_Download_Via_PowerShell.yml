title: PHANTOMPULL Stager Download via PowerShell
id: d04a29a1-0bd8-498c-85a2-3f8d16fc0c9d
status: experimental
description: Detects the execution of a PowerShell 'iwr' command used to download the initial PHANTOMPULL stager script.
references:
    - https://www.elastic.co/security-labs/threat-command/phantom-in-the-vault
author: ioc-yara-daily (agentic)
date: 2024-05-22
tags:
    - attack.execution
    - attack.t1059.001
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'iwr'
            - 'http://195.3.222.251/script1.ps1'
            - '-OutFile'
            - '\tt.ps1'
            - '-UseBasicParsing'
    condition: selection
falsepositives:
    - Unlikely
level: high
