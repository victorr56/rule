title: PHANTOMPULSE macOS Persistence via LaunchAgent
id: a8d03c62-811c-4b68-80f4-5f560e90c88a
status: experimental
description: Detects the PHANTOMPULSE backdoor creating its persistence LaunchAgent property list file on macOS.
references:
    - https://www.elastic.co/security-labs/threat-command/phantom-in-the-vault
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.persistence
    - attack.t1543.001
logsource:
    category: file_event
    product: macos
detection:
    selection:
        Image|endswith: '/Users/Shared/svchost'
        TargetFilename|endswith: '/Library/LaunchAgents/com.vfrfeufhtjpwgray.plist'
    condition: selection
falsepositives:
    - Unlikely
level: critical
