title: STAC3725/DragonForce User Account Creation
id: 1ea6fcf1-5369-42b7-8149-165c370a2569
status: experimental
description: Detects the creation of local user accounts with names specifically used by the STAC3725 group during DragonForce ransomware intrusions.
references:
    - https://www.huntress.com/blog/citrixbleed-2-dragonforce-ransomware
author: ioc-yara-daily (agentic)
date: 2024-06-25
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_ctxapp:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains|all:
            - 'user'
            - 'CtxAppVCOMService'
            - '/add'
    selection_ctxsvc:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains|all:
            - 'user'
            - 'ctxsvc'
            - '/add'
    condition: 1 of selection_*
falsepositives:
    - Legitimate user account creation using these specific names, which is highly unlikely.
level: high
