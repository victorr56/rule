title: LiteLlmSupplyChain Windows Reconnaissance Activity
id: 8d7c6b5e-a4f3-4e2d-8b5d-9c3f4b6e5d1a
status: experimental
description: Detects a Python process spawning system or network information commands, as seen in the LiteLlmSupplyChain malware on Windows.
references:
    - https://www.microsoft.com/en-us/security/blog/2026/10/23/inside-the-litellm-1-107-0-supply-chain-compromise-credential-theft-through-python-startup-hooks/
author: ioc-yara-daily (agentic)
date: 2026-10-24
tags:
    - attack.discovery
    - attack.t1082
    - attack.t1016
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\python.exe'
        Image|endswith:
            - '\systeminfo.exe'
            - '\ipconfig.exe'
    condition: selection
falsepositives:
    - Legitimate administrative or IT management scripts written in Python that perform system discovery.
level: medium
