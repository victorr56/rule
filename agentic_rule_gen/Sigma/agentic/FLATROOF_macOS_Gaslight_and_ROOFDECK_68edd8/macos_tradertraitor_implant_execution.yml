title: TraderTraitor FLATROOF/ROOFDECK Implant Execution
id: f42e47e8-e16e-44c1-8408-54cc419fbbd7
status: experimental
description: Detects the execution of FLATROOF or ROOFDECK implants from their specific installation paths within the user's Library directory.
references:
    - https://www.sentinelone.com/labs/dont-call-us-well-call-your-apis-tradertraitor-backdoors-resurface-on-victim-with-no-crypto-ties/
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.execution
    - attack.persistence
    - attack.t1543.001
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith:
            - '/com.apple.iTunesCloud/SystemUpdate'
            - '/com.apple.internal.ck/iSync'
            - '/com.apple.appleaccountd/loginwindow'
        ParentImage: /sbin/launchd
    condition: selection
falsepositives:
    - Legitimate software is not expected to be executed from these masquerading paths.
level: high
