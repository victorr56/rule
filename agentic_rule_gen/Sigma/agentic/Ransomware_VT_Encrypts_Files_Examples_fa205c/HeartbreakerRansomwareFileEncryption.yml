title: Heartbreaker Ransomware File Rename Activity
id: b349d472-73d9-4859-9686-3532f831341c
status: experimental
description: Detects the use of the 'mv' command to rename files with the .heartbreaker extension, a behavior associated with the Heartbreaker macOS ransomware.
references:
    - https://blog.virustotal.com/2026/11/catching-ransomware-introducing.html
author: ioc-yara-daily (agentic)
date: 2026-11-20
tags:
    - attack.impact
    - attack.t1486
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/bin/mv'
        CommandLine|contains: '.heartbreaker'
    condition: selection
falsepositives:
    - Legitimate administration scripts that may rename files containing the string '.heartbreaker'.
level: high
