title: REF5961 RUDEBIRD PsExec Lateral Movement
id: 574ef0df-3932-4876-b371-b0e51383cd89
status: experimental
description: Detects lateral movement using a renamed PsExec instance ('exec.exe') to execute the RUDEBIRD payload 'RVTDM.EXE' from the debug directory.
references:
    - https://www.elastic.co/security-labs/threat-command/introducing-the-ref5961-intrusion-set
author: ioc-yara-daily (agentic)
date: 2026-10-18
tags:
    - attack.lateral_movement
    - attack.t1021.002
    - attack.execution
    - attack.t1570
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\help\exec.exe'
        CommandLine|contains|all:
            - '/accepteula'
            - '-s'
            - 'C:\windows\debug\RVTDM.EXE'
    condition: selection
falsepositives:
    - Unlikely
level: high
