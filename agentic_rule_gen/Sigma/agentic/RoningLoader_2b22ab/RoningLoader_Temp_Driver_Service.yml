title: RoningLoader Temporary Driver Service Creation
id: e464d257-ec91-4c6e-8d8a-deaa7e2246c0
status: experimental
description: Detects the creation of a Windows service named 'xererre1' to load a temporary driver, a technique used by RoningLoader for defense evasion.
references:
    - https://www.elastic.co/security-labs/threat-command/roningloader
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.defense_evasion
    - attack.t1543.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\sc.exe'
        CommandLine|contains|all:
            - 'create'
            - 'xererre1'
            - 'binPath='
            - '1912763.temp'
    condition: selection
falsepositives:
    - Unlikely
level: high
