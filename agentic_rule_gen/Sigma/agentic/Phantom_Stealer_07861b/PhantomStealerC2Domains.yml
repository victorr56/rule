title: Phantom Stealer C2 Domain Query
id: f1a2938b-b7c4-4d8e-a9b0-c6d7e89f0a1b
status: experimental
description: Detects DNS queries for domains reported as C2 infrastructure for Phantom Stealer.
references:
    - https://www.group-ib.com/blog/phantom-stealer-credential-theft/
author: ioc-yara-daily (agentic)
date: 2026-10-27
tags:
    - attack.command_and_control
    - attack.t1071
    - attack.exfiltration
    - attack.t1041
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName|endswith:
            - '.scxzswx.lovestoblog.com'
            - '.Exczx.com'
    condition: selection
falsepositives:
    - Unlikely
level: high
