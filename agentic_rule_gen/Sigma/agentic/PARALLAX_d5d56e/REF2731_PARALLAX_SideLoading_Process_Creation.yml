title: REF2731/PARALLAX MsiDb.exe Execution from Non-Standard Path
id: b7e5f91a-8c10-444b-b09e-1d37a2f0e6e7
status: experimental
description: Detects MsiDb.exe running from a non-standard location, which is a behavior associated with the PARALLAX loader's DLL side-loading technique.
references:
    - https://www.elastic.co/security-labs/threat-command/exploring-the-ref2731-intrusion-set
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.defense_evasion
    - attack.t1574.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\MsiDb.exe'
        OriginalFileName: 'msidb.exe'
    filter:
        Image|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
    condition: selection and not filter
falsepositives:
    - Legitimate but rare scenarios where MsiDb.exe is copied and run from another directory for administrative or software packaging purposes.
level: medium
