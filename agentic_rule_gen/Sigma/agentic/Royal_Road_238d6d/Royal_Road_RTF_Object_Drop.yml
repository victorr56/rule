title: Royal Road RTF Object Drop '8.t'
id: 5b6c9a3d-4e9f-4b0c-99c9-21a4f07e997f
status: experimental
description: Detects the creation of a file named '8.t', which is the default name for an embedded object within malicious RTF files generated by the Royal Road weaponizer.
references:
    - http://nao-sec.org/2021/01/royal-road-redive.html
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.t1203
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith:
            - '\WINWORD.EXE'
            - '\POWERPNT.EXE'
            - '\EXCEL.EXE'
            - '\OUTLOOK.EXE'
            - '\EQNEDT32.EXE'
        TargetFilename|endswith: '\8.t'
    condition: selection
falsepositives:
    - Unlikely
level: high
