title: Qilin Actor Gmon Miner Execution
id: c96ae8f5-937d-4ba6-8fc7-60e5ff386121
status: experimental
description: Detects the execution of the 'gmon' miner from a specific staging directory.
references:
    - https://www.wiz.io/blog/ai-infrastructure-honeypot
author: ioc-yara-daily (agentic)
date: 2024-06-27
tags:
    - attack.execution
    - attack.resource_hijacking
    - attack.t1496
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith: '/gmon'
        CurrentDirectory|endswith: '/tmp/.dbus-cache'
    condition: selection
falsepositives:
    - Unlikely
level: high
