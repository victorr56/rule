title: PHANTOMPULSE Scheduled Task Persistence
id: 5b43d2c1-84a4-44b2-b4f0-459f0f9b626d
status: experimental
description: Detects the creation of scheduled tasks via schtasks.exe using names associated with the PHANTOMPULSE RAT for persistence.
references:
    - https://www.elastic.co/security-labs/threat-command/blockchain-c2-phantompulse-rat-sinkhole
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/tn'
        CommandLine|contains:
            - 'DotNetSvcCoreTask'
            - 'DotNetSvcUpdateTask'
            - 'DotNetSvcUserTask'
            - '\Microsoft\Windows\NetFramework\DotNetSvcCoreTask'
    condition: selection
falsepositives:
    - Legitimate administrative scripts creating tasks with these specific names.
level: high
