title: PHANTOMPULSE Persistence Execution via Rundll32
id: 11f7c8d9-2e0a-4b71-9c6a-4f51e089201f
status: experimental
description: Detects the execution of the PHANTOMPULSE persistence mechanism, which uses rundll32.exe to load the malicious 'svcagent.dll' via its DllRegisterServer export.
references:
    - https://www.elastic.co/security-labs/threat-command/blockchain-c2-phantompulse-rat-sinkhole
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.execution
    - attack.t1218.011
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains|all:
            - '\AssetMon\svcagent.dll'
            - ',DllRegisterServer'
    condition: selection
falsepositives:
    - Unlikely
level: high
