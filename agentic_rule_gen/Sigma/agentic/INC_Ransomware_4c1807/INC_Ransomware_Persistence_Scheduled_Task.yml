title: INC Ransomware Persistence via "RealtekAudioSvc" Scheduled Task
id: e8a91b41-5c3a-4f5d-9c2b-272e50d5345d
status: experimental
description: Detects the creation of a scheduled task named "RealtekAudioSvc" used by an INC ransomware affiliate for persistence.
references:
    - https://socradar.io/blog/inc-gentlemen-ransomware-ai-infrastructure/
author: ioc-yara-daily (agentic)
date: 2026-10-22
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/tn'
            - 'RealtekAudioSvc'
    condition: selection
falsepositives:
    - Unlikely, as this specific task name is not a default Windows or Realtek task.
level: high
