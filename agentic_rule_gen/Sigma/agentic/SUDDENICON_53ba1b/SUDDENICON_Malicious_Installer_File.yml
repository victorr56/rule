title: SUDDENICON Malicious 3CXDesktopApp Installer Execution
id: 11c62fbb-8d8a-493e-a160-c3d3dd54d241
status: experimental
description: Detects the execution of known malicious MSI installers for the trojanized 3CXDesktopApp. This was part of the SUDDENICON supply chain attack.
references:
    - https://www.elastic.co/security-labs/threat-command/elastic-users-protected-from-suddenicon-supply-chain-attack
author: ioc-yara-daily (agentic)
date: 2024-05-23
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\msiexec.exe'
        CommandLine|contains:
            - '3cxdesktopapp-18.12.407.msi'
            - '3cxdesktopapp-18.12.416.msi'
    condition: selection
falsepositives:
    - Security researchers or system administrators executing these specific compromised versions for analysis.
level: high
