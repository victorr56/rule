title: macOS TCC Database Modification via sqlite3
id: 9fa1c77f-17f1-4876-bc34-45de193796dd
status: experimental
description: Detects the use of the `sqlite3` binary to modify the macOS Transparency, Consent, and Control (TCC) database. This technique is used by JOKERSPY to grant unauthorized permissions to their malware.
references:
    - https://www.elastic.co/security-labs/threat-command/inital-research-of-jokerspy
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.defense_evasion
    - attack.t1553
logsource:
    category: file_event
    product: macos
detection:
    selection:
        Image|endswith: '/sqlite3'
        TargetFilename|endswith: '/Library/Application Support/com.apple.TCC/TCC.db'
    condition: selection
falsepositives:
    - Legitimate system administrators using `sqlite3` to manually inspect or modify the TCC database.
level: high
