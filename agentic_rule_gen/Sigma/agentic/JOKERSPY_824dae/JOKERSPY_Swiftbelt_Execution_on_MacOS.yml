title: JOKERSPY - Swiftbelt Execution on macOS
id: 610f4492-c0e8-466d-88f6-1736b4ff0251
status: experimental
description: Detects the execution of the Swiftbelt enumeration tool as observed in JOKERSPY intrusions. The command line includes executing the binary from '/users/shared/sb' and redirecting output to a log file.
references:
    - https://www.elastic.co/security-labs/threat-command/inital-research-of-jokerspy
author: ioc-yara-daily (agentic)
date: 2026-10-26
tags:
    - attack.t1059.004
    - attack.t1010
    - detection.threat_hunting
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/sb'
        CommandLine|contains|all:
            - '/bin/sh -c'
            - '/users/shared/sb'
            - '> /users/shared/sb.log'
    condition: selection
falsepositives:
    - Unlikely
level: high
