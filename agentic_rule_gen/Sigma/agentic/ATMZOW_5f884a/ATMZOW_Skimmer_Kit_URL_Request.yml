title: ATMZOW Skimmer Kit URL Request
id: 3c9b5b7b-232a-430c-8bd9-8255b768114f
status: experimental
description: Detects requests to URLs known to host or receive data from the ATMZOW JavaScript skimmer.
references:
    - https://www.group-ib.com/blog/switching-side-jobs/
author: ioc-yara-daily (agentic)
date: 2026-10-23
tags:
    - attack.collection
    - attack.t1056.001
    - attack.exfiltration
    - attack.t1071.001
logsource:
    product: proxy
detection:
    selection_1:
        DestinationHostname|endswith: 'designestylelab.com'
        Url.Path|endswith: '/css/'
    selection_2:
        DestinationHostname|endswith: 'gvenlayer.com'
        Url.Path|endswith: '/track/'
    condition: 1 of selection_*
falsepositives:
    - Unlikely
level: high
