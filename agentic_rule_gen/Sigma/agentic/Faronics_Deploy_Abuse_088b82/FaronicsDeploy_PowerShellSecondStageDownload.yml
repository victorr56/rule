title: Faronics Deploy Abuse - PowerShell Second Stage Download
id: 5691f93a-8610-482a-a9da-8b5e5330a59a
status: experimental
description: Detects the execution of PowerShell to download a second-stage payload from a known malicious URL associated with Faronics Deploy abuse.
references:
    - https://www.huntress.com/blog/faronics-deploy-abuse
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.execution
    - attack.t1059.001
    - attack.command_and_control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: 'askaboutme121/Xusyahfd/refs/heads/main/Jhinstaller.ps1'
    condition: selection
falsepositives:
    - Unlikely
level: critical
