title: Mini-Shai-Hulud Linux Persistence Service File
id: 59a16f9f-02a8-42fa-90f7-ebf0e6988220
status: experimental
description: Detects the creation of the systemd service file used by Mini-Shai-Hulud for persistence on Linux systems.
references:
    - https://www.wiz.io/blog/mini-shai-hulud-teampcp-hits-antv-supply-chain
author: ioc-yara-daily (agentic)
date: 2024-07-24
tags:
    - attack.persistence
    - attack.t1543.002
logsource:
    category: file_event
    product: linux
detection:
    selection:
        Image|endswith: '/.config/.git/.config'
        TargetFilename|endswith: '/.config/systemd/user/kitty-monitor.service'
    condition: selection
falsepositives:
    - Unlikely
level: high
