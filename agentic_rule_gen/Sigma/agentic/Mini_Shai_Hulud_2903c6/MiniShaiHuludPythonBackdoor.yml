title: Mini-Shai-Hulud Python Backdoor Download and Execution
id: c030ec60-5f25-4fc1-a980-60b61be49491
status: experimental
description: Detects the specific command line used to download and execute the Mini-Shai-Hulud Python backdoor 'cat.py' as part of the ANTV supply-chain attack.
references:
    - https://www.wiz.io/blog/mini-shai-hulud-teampcp-hits-antv-supply-chain
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.execution
    - attack.t1059.004
    - attack.t1059.006
    - attack.t1105
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        ParentImage|endswith:
            - '/python'
            - '/python3'
        Image|endswith:
            - '/sh'
            - '/bash'
        CommandLine|contains|all:
            # Corresponds to: curl ... cat.py > .../.local/share/kitty/cat.py && python3 .../.local/share/kitty/cat.py
            - 'curl'
            - 'cat.py'
            - '>'
            - '.local/share/kitty/cat.py'
            - '&&'
            - 'python3'
    condition: selection
falsepositives:
    - Unlikely
level: high
