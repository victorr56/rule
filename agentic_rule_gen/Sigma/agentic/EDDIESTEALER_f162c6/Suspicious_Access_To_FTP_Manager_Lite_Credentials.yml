title: Suspicious Access to FTP Manager Lite Credentials
id: 03135c3c-23fa-4c66-857c-8ce8b1b2cd1b
status: experimental
description: Detects a process other than FTP Manager Lite accessing its settings database, which may indicate credential theft activity by malware like EDDIESTEALER.
references:
    - https://www.elastic.co/security-labs/threat-command/eddiestealer
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.credential_access
    - attack.t1555.003
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|contains|all:
            - '\DeskShare Data\FTP Manager Lite\'
            - '\FTPManagerLiteSettings.db'
        Image|endswith: '.exe'
    filter:
        Image|endswith: '\FTP Manager Lite.exe'
    condition: selection and not filter
falsepositives:
    - Backup software or other system administration tools that read application data.
level: medium
