author: ioc-yara-daily (agentic)
date: 2026-10-28
tags:
    - attack.command_and_control
    - attack.t1566
logsource:
    category: network_connection
detection:
    selection:
        DestinationIp: '67.205.150.245'
    condition: selection
falsepositives:
