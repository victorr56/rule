title: Potential SQL Injection Post-Exploitation With Sqlmap OS-Shell
id: f8346f33-1250-4d56-834f-01309d7494f1
status: experimental
description: Detects the use of sqlmap with the "--os-shell" parameter, which attempts to spawn a shell on the target system. This is a common post-exploitation technique following a successful SQL injection attack and was observed being used by the ResumeLooters group.
references:
    - https://www.group-ib.com/blog/resumelooters/
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_py:
        Image|endswith: '\python.exe'
        CommandLine|contains|all:
            - 'sqlmap'
            - '--os-shell'
    selection_exe:
        Image|endswith: '\sqlmap.exe'
        CommandLine|contains: '--os-shell'
    condition: 1 of selection_*
falsepositives:
    - Authorized penetration testing activities.
level: high
