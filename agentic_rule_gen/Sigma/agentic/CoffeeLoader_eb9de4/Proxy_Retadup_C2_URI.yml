title: Retadup C2 Check-in URI Pattern
id: 3c6218d6-4dd8-4e89-9a74-d47156942b0c
status: experimental
description: Detects the specific URI pattern and User-Agent used by the Retadup worm for C2 check-ins.
references:
    - https://securelist.com/retadup-delivers-coffeeloader/121908/
author: ioc-yara-daily (agentic)
date: 2026-11-20
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection:
        Url|re: '/[A-F0-9]{32}/1/4/1/0/empty$'
        HttpUserAgent: 'Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1; SV1)'
    condition: selection
falsepositives:
    - Unlikely
level: high
