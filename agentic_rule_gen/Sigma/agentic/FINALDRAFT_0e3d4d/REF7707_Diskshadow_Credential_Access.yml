title: REF7707 Credential Access via Diskshadow
id: 137b77a1-87a3-4b67-88eb-10f82df0e2f8
status: experimental
description: Detects the use of diskshadow.exe to execute a script from a specific path in ProgramData to extract registry hives for credential access, as seen in REF7707 campaigns.
references:
    - https://www.elastic.co/security-labs/threat-command/fragile-web-ref7707
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.credential_access
    - attack.t1003.003
detection:
    selection:
        Image|endswith: '\diskshadow.exe'
        CommandLine|contains|all:
            - '/s'
            - 'C:\ProgramData\SoftwareDistribution.txt'
    condition: selection
falsepositives:
    - Legitimate administrative scripts using this specific and unusual file path.
level: high
logsource:
    category: process_creation
    product: windows
