title: Aokigahara Infostealer C2 Communication
id: 3c62955f-d238-4e50-98d9-24750c3779e0
status: experimental
description: Detects HTTP requests with a specific User-Agent and URI path combination used by the Aokigahara infostealer for C2 communications.
references:
    - https://research.checkpoint.com/2026/infostealer-riding-the-ai-train/
author: ioc-yara-daily (agentic)
date: 2026-10-24
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection:
        UserAgent: 'Microsoft-CryptoAPI/10.0'
        Url|endswith:
            - '/gate/handshake'
            - '/gate/chunk'
            - '/gate/complete'
    condition: selection
falsepositives:
    - Unlikely
level: critical
