title: Turla CerealLoader in .NET Native Image Cache
id: a9f0b1c8-7d6e-4b5a-9c8d-1e2f3a4b5c6d
status: experimental
description: Detects the IIS Worker Process (w3wp.exe) creating a malicious DLL in the .NET Native Image Cache, a technique used by Turla's CerealLoader.
references:
    - https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/
author: ioc-yara-daily (agentic)
date: 2024-06-18
tags:
    - attack.execution
    - attack.defense_evasion
    - attack.persistence
    - attack.t1574.002
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\w3wp.exe'
        TargetFilename|contains|all:
            - '\assembly\NativeImages_'
            - '\Microsoft.Exchange.Search.Mdb.ni.dll'
    condition: selection
falsepositives:
    - Unlikely
level: high
