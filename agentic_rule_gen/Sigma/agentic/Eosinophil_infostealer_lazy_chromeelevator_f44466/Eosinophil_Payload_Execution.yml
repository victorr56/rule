title: Eosinophil Infostealer Payload Execution Pattern
id: 6a3500d8-5777-4c75-8025-50ac989b5c3b
status: experimental
description: Detects the execution of a randomly named executable from the C:\Windows directory, a pattern observed with Eosinophil infostealer payloads.
references:
    - https://blog.virustotal.com/2026/01/malicious-infostealer-january-26.html
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.execution
    - attack.defense_evasion
    - attack.t1036.005
    - detection.threat_hunting
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        ParentImage|endswith: '\explorer.exe'
        Image|re: 'C:\\Windows\\[a-zA-Z0-9]{5,9}\.exe'
    condition: selection
falsepositives:
    - Legitimate installers or updaters launched by the user that place temporary executables in the C:\Windows directory.
level: medium
