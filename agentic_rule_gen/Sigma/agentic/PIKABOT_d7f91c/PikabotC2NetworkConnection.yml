title: PIKABOT C2 Network Connection
id: 9a8b7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d
status: experimental
description: Detects network connections to IP addresses known to be used by PIKABOT for C2 communications.
references:
    - https://www.elastic.co/security-labs/threat-command/pikabot-i-choose-you
author: ioc-yara-daily (agentic)
date: 2026-10-18
tags:
    - attack.command_and_control
    - attack.t1573
logsource:
    category: network_connection
detection:
    selection:
        DestinationIp:
            - '158.220.80.167'
            - '139.84.237.229'
            - '85.239.243.155'
            - '104.129.55.104'
    condition: selection
falsepositives:
    - These IPs could be reassigned to benign services in the future.
level: high
