title: PIKABOT PowerShell Download and Execution
id: a0b1c2d3-e4f5-4a6b-7c8d-9e0f1a2b3c4d
status: experimental
description: Detects the PowerShell command line used by PIKABOT to download and execute its payload into the Public user folder.
references:
    - https://www.elastic.co/security-labs/threat-command/pikabot-i-choose-you
author: ioc-yara-daily (agentic)
date: 2026-10-18
tags:
    - attack.execution
    - attack.t1059.001
    - attack.t1204.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'Invoke-WebRequest'
            - '-OutFile'
            - '\Users\Public\'
            - '.exe; saps '
    condition: selection
falsepositives:
    - Highly specific administrative scripts, though the combination is suspicious.
level: high
