title: WARMCOOKIE Persistence Execution via Rundll32
id: 5740445d-7521-4eb7-be18-b2a8c3d9b1cd
status: experimental
description: |-
    Detects the execution of the WARMCOOKIE backdoor persistence mechanism. The malware is executed via a scheduled task that calls rundll32.exe to launch the malicious DLL from 'C:\ProgramData\RtlUpd\RtlUpd.dll' with the 'Start' export.
references:
    - https://www.elastic.co/security-labs/threat-command/dipping-into-danger
author: ioc-yara-daily (agentic)
date: 2026-10-18
tags:
    - attack.persistence
    - attack.t1547.001
    - attack.t1053.005
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains|all:
            - '\ProgramData\RtlUpd\RtlUpd.dll'
            - ',Start'
            - '/p'
    condition: selection
falsepositives:
    - Unlikely
level: high
