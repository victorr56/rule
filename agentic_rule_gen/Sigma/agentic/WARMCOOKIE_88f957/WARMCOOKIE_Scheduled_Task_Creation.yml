title: WARMCOOKIE Persistence via Scheduled Task Creation
id: 6a3f4e3c-24ad-4d43-982a-5b1b46a2a0ee
status: experimental
description: |-
    Detects the creation of the WARMCOOKIE persistence scheduled task. The task, named 'RtlUpd', is configured to run rundll32.exe with the malicious DLL.
references:
    - https://www.elastic.co/security-labs/threat-command/dipping-into-danger
author: ioc-yara-daily (agentic)
date: 2026-10-18
tags:
    - attack.persistence
    - attack.t1053.005
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/tn'
            - 'RtlUpd'
            - '/tr'
            - 'rundll32.exe'
            - 'C:\ProgramData\RtlUpd\RtlUpd.dll'
    condition: selection
falsepositives:
    - Unlikely
level: high
