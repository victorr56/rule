title: OXLOADER Payload Execution
id: 7b35e01a-8c54-47dd-b6f7-b2f567b57bde
status: experimental
description: |
  Detects the execution of known OXLOADER payloads. This is achieved by looking for the specific payload filenames being executed by a parent process located in a temporary or user-writable directory, which is indicative of a dropper executing its payload.
references:
  - https://www.elastic.co/security-labs/threat-command/oxloader-malware-loader-infostealer
author: ioc-yara-daily (agentic)
date: 2024-06-25
tags:
  - attack.execution
  - attack.t1204.002
  - attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\apimonitor-x64.exe'
      - '\node-v24.15.0-x64-86.exe'
    ParentImage|contains:
      - ':\Users\'
      - ':\Windows\Temp\'
  filter_legit_apimonitor:
    Image|startswith: 'C:\Program Files\rohitab.com\API Monitor v2\'
  condition: selection and not filter_legit_apimonitor
falsepositives:
  - Legitimate software installers that unpack and run components from temporary locations during installation.
  - Legitimate use of API Monitor if installed in a non-default directory and launched by a process in a user directory.
level: high
