title: NightEagle Post-Exploitation User Creation
id: c071987d-8625-4c6e-8120-008103ed7a5f
status: experimental
description: Detects a specific command used by NightEagle to create a local user 'bosch' with a hardcoded password.
references:
    - https://securelist.com/tr/nighteagle-apt-ghostcontainer-and-tunneling/121323/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\net.exe'
        CommandLine|contains|all:
            - 'user'
            - 'bosch'
            - 'Ktk17362'
            - '/add'
    condition: selection
falsepositives:
    - Legitimate administrative activity creating a user with the same name and password.
level: high
