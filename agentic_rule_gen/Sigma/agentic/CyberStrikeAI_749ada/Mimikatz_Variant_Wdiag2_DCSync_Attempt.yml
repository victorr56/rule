title: Mimikatz Variant Wdiag2 DCSync Attempt
id: 17292211-171b-4d43-9878-57d1976a1698
status: experimental
description: Detects a DCSync attack using a renamed Mimikatz variant named 'wdiag2.exe'. This technique is used by the operator behind CyberStrikeAI.
references:
    - https://securelist.com/tr/cyberstrikeai-attacks/121715/
author: ioc-yara-daily (agentic)
date: 2026-11-02
tags:
    - attack.credential_access
    - attack.t1003.006
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\wdiag2.exe'
        CommandLine|contains|all:
            - '-DCSync'
            - '-d'
    condition: selection
falsepositives:
    - Unlikely
level: high
