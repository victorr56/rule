title: Kubernetes Secret Dump via cURL Command
id: 119a008c-0ef8-466d-9781-817ab462c8e3
status: experimental
description: Detects a cURL command used to dump all secrets from the Kubernetes API using a service account token. This specific variant was seen in agentic attacks.
references:
    - https://www.wiz.io/blog/the-rise-of-agentic-attacks
author: ioc-yara-daily (agentic)
date: 2026-10-30
tags:
    - attack.credential_access
    - attack.t1552.007
logsource:
    product: linux
    category: process_creation
detection:
    selection:
        Image|endswith: '/curl'
        CommandLine|contains|all:
            - 'Authorization: Bearer'
            - 'cat /var/run/secrets/kubernetes.io/serviceaccount/token'
            - 'kubernetes.default.svc'
            - '/api/v1/secrets'
    condition: selection
falsepositives:
    - Highly unusual for legitimate administration, but custom diagnostic or poorly designed applications might perform this action.
level: high
