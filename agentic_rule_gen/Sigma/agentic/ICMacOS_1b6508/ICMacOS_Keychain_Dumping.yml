title: ICMacOS Keychain Dumping
id: 91b1ac55-ffab-47ac-8728-660c1d933c1d
status: experimental
description: Detects the command used by ICMacOS to dump the login keychain to a text file.
references:
    - https://socradar.io/blog/icmacos-infostealer-rat/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.credential_access
    - attack.t1552.001
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/usr/bin/security'
        CommandLine|contains|all:
            - 'dump-keychain'
            - 'login.keychain-db'
            - 'keychain_dump_raw.txt'
    condition: selection
falsepositives:
    - Legitimate keychain analysis or backup scripts, though the combination of arguments and specific output file is suspicious.
level: high
