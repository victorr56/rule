title: ICMacOS Persistence LaunchAgent Loading
id: 25c7e3f8-8a8b-494b-97e3-0c46b60f5c1d
status: experimental
description: Detects the loading of the ICMacOS LaunchAgent via 'launchctl bootstrap' command.
references:
    - https://socradar.io/blog/icmacos-infostealer-rat/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.persistence
    - attack.t1543.001
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/bin/launchctl'
        CommandLine|contains|all:
            - 'bootstrap'
            - 'com.apple.systemupdater.plist'
    condition: selection
falsepositives:
    - Unlikely
level: high
