title: ICMacOS Browser Credential Key Extraction from Keychain
id: 9a78f30d-2b3a-449e-b8d4-8d96e578c7b8
status: experimental
description: Detects the use of the 'security' command to extract Chromium's 'Safe Storage' master key from the macOS Keychain.
references:
    - https://socradar.io/blog/icmacos-infostealer-rat/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.credential_access
    - attack.t1555.003
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/usr/bin/security'
        CommandLine|contains|all:
            - 'find-generic-password'
            - '-s'
            - 'Safe Storage'
    condition: selection
falsepositives:
    - Legitimate credential migration tools, but this specific command-line execution is highly suspicious.
level: high
