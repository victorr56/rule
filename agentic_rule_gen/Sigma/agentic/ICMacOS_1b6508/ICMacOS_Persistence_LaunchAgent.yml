title: ICMacOS Persistence LaunchAgent Creation
id: 5971485c-1ddc-4a37-9755-a0c644f77c34
status: experimental
description: Detects the creation of the 'com.apple.systemupdater.plist' LaunchAgent file used by ICMacOS for persistence.
references:
    - https://socradar.io/blog/icmacos-infostealer-rat/
author: ioc-yara-daily (agentic)
date: 2024-06-25
tags:
    - attack.persistence
    - attack.t1543.001
logsource:
    category: file_event
    product: macos
detection:
    selection:
        Image|endswith: '/system-update/system-update'
        TargetFilename|endswith: '/Library/LaunchAgents/com.apple.systemupdater.plist'
    condition: selection
falsepositives:
    - Unlikely
level: high
