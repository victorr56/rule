title: SILENTCONNECT Payload URL/URI
id: 746b19a1-77d0-47e9-a78b-d7d8e8b6b158
status: experimental
description: Detects web requests to URLs/URIs used by SILENTCONNECT to deliver payloads.
references:
    - https://www.elastic.co/security-labs/threat-command/silentconnect-delivers-screenconnect
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.t1105
    - detection.threat_hunting
logsource:
    category: proxy
detection:
    selection:
        Url|contains:
            - '/Bin/ScreenConnect.ClientSetup.msi?e=Access&y=Guest'
            - '/download_invitee.php'
        HttpMethod: 'GET'
    condition: selection
falsepositives:
    - 'Legitimate use of ScreenConnect / ConnectWise Control.'
level: medium
