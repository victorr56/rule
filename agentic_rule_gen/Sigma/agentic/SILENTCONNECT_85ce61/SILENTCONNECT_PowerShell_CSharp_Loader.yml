title: SILENTCONNECT PowerShell CSharp Loader
id: 59a1f592-d3a3-48bd-b8c7-4340d86948ad
status: experimental
description: Detects the execution of a PowerShell command line used by SILENTCONNECT to download a C# payload, read it into a variable, and execute it in memory using Add-Type.
references:
    - https://www.elastic.co/security-labs/threat-command/silentconnect-delivers-screenconnect
author: ioc-yara-daily (agentic)
date: 2024-06-25
tags:
    - attack.t1059.001
    - attack.t1105
    - attack.t1027
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'curl.exe'
            - 'FileR.txt'
            - 'ReadAllText'
            - 'Add-Type'
            - '-Language CSharp'
    condition: selection
falsepositives:
    - 'Unlikely'
level: critical
