title: REF3927 TOLLBOOTH IIS Module Load
id: 3c5936ca-006f-47ed-8785-523178c773a4
status: experimental
description: |-
    Detects the loading of malicious IIS modules associated with the TOLLBOOTH malware. These modules are loaded by the IIS worker process (w3wp.exe) to perform SEO cloaking and provide webshell access.
references:
    - https://www.elastic.co/security-labs/threat-command/tollbooth
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.t1505.004
logsource:
    category: image_load
    product: windows
detection:
    selection:
        Image|endswith: '\w3wp.exe'
        ImageLoaded|endswith:
            - '\caches.dll'
            - '\scripts.dll'
            - '\CustomIISModule.dll'
    condition: selection
falsepositives:
    - Unlikely
level: high
