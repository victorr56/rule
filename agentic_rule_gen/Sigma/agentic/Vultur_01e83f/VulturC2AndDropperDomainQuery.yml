title: Vultur C2 And Dropper Domain Query
id: c1682333-e840-4e3e-8c3e-f6338b7e289f
status: experimental
description: Detects DNS queries for domains used by the Vultur Android malware for C2 and the Brunhilda dropper for distribution.
references:
    - https://blog.fox-it.com/2024/03/28/android-malware-vultur-expands-its-wingspan/
author: ioc-yara-daily (agentic)
date: 2024-03-28
tags:
    - attack.command_and_control
    - attack.t1071
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName|endswith:
            - 'safetyfactor.online'
            - 'cloudmiracle.store'
            - 'cloudmarcie.store'
        QueryName|re: 'mcafee\.\d{6}\.com$'
    condition: selection
falsepositives:
    - Unlikely
level: critical
