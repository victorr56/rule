title: ShadowV2 Spreader Initial Access Attempt
id: 1ea624c9-c8ac-4fe6-a979-d102e3b2b8d0
status: experimental
description: Detects initial access attempts from the ShadowV2 spreader via its specific Python Docker SDK User-Agent and a request to the Docker 'containers/create' API endpoint. This is indicative of an attempt to exploit an exposed Docker daemon.
references:
    - https://www.darktrace.com/blog/shadowv2-an-emerging-ddos-for-hire-botnet
author: ioc-yara-daily (agentic)
date: 2024-06-25
tags:
    - attack.initial_access
    - attack.t1190
logsource:
    category: proxy
detection:
    selection:
        UserAgent: 'docker-sdk-python/7.1.0'
        Url|endswith: '/v1.44/containers/create'
    condition: selection
falsepositives:
    - Legitimate administrative activity using this specific version of the Python Docker SDK to create containers.
level: medium
