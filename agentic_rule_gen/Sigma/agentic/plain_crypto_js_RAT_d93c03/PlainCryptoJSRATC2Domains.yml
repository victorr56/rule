title: Plain-Crypto-JS RAT C2 Domains
id: 4a2b9e6f-124b-4c59-ac23-7489ab5f14e7
status: experimental
description: Detects DNS queries for domains associated with the plain-crypto-js RAT C2 infrastructure.
references:
    - https://www.huntress.com/blog/supply-chain-compromise-axios-npm-package
author: ioc-yara-daily (agentic)
date: 2026-10-18
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName|endswith:
            - 'sfrclak.com'
            - 'calltan.com'
            - 'callnrwise.com'
    condition: selection
falsepositives:
    - Unlikely, as these domains are controlled by the threat actor.
level: high
