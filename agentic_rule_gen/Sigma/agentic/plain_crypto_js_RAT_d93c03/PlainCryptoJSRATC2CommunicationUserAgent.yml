title: Plain-Crypto-JS RAT C2 Communication User-Agent
id: 54b41b18-b0a3-43f1-b84e-a18ac4a73e5f
status: experimental
description: Detects C2 communication patterns of Plain-Crypto-JS RAT that use a specific hardcoded and outdated User-Agent string in combination with other request artifacts like the URI path and HTTP method.
references:
    - https://www.huntress.com/blog/supply-chain-compromise-axios-npm-package
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection:
        HttpUserAgent: 'mozilla/4.0 (compatible; msie 8.0; windows nt 5.1; trident/4.0)'
        Url|endswith: '/upload'
        HttpMethod: 'POST'
    condition: selection
falsepositives:
    - Extremely old or bespoke client applications that use this specific combination of User-Agent, URI path, and HTTP method.
level: high
