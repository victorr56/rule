title: Singularity Rootkit Persistence File Creation
id: 104b7ca5-f938-4e08-9df8-e73099903960
status: experimental
description: Detects commands used to create the persistence file for the Singularity rootkit, which loads a malicious kernel module on boot.
references:
    - https://www.elastic.co/security-labs/threat-command/linux-rootkits-2-caught-in-the-act
author: ioc-yara-daily (agentic)
date: 2024-07-24
tags:
    - attack.persistence
    - attack.t1547.006
logsource:
    category: process_creation
    product: linux
detection:
    selection_shell:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/ash'
            - '/zsh'
        CommandLine|contains|all:
            - 'echo'
            - 'singularity'
            - '/etc/modules-load.d/singularity.conf'
    selection_echo:
        Image|endswith: '/echo'
        CommandLine|contains|all:
            # The 'echo' command's arguments don't include 'echo' itself
            - 'singularity'
            - '/etc/modules-load.d/singularity.conf'
    selection_tee:
        Image|endswith: '/tee'
        CommandLine|contains: '/etc/modules-load.d/singularity.conf'
    condition: 1 of selection_*
falsepositives:
    - Legitimate use of a tool named 'singularity' that may require specific kernel modules, though this is unlikely to be configured via raw shell commands.
level: high
