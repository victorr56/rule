title: Gambling Goblin PasswordHarvester Execution
id: 54101e4e-0a06-4b2a-89a5-768a44d87216
status: experimental
description: Detects the execution of the PasswordHarvester component, named "unix_updates", with its specific hardcoded arguments as used by the Gambling Goblin threat actor.
references:
    - https://research.checkpoint.com/2026/gaming-the-system-how-a-chinese-speaking-actor-turned-brazilian-government-sites-into-an-seo-weapon/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.execution
    - attack.t1059
    - attack.credential_access
    - attack.t1552.004
detection:
    selection:
        Image|endswith: '/usr/sbin/unix_updates'
        CommandLine|contains: ' -v FuckMe#988'
    condition: selection
falsepositives:
    - Unlikely
level: critical
logsource:
    category: process_creation
    product: linux
