title: BlueNorOff RUSTBUCKET Persistent Payload Execution
id: c7962c0b-4029-4d64-9273-047b3152bb53
status: experimental
description: Detects the execution of the RUSTBUCKET payload from its persistence location. The payload is typically run with a C2 URL as a command-line argument.
references:
    - https://www.elastic.co/security-labs/threat-command/DPRK-strikes-using-a-new-variant-of-rustbucket
author: ioc-yara-daily (agentic)
date: 2026-10-18
tags:
    - attack.execution
    - attack.t1543.001
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/Library/Metadata/System Update'
        CommandLine|contains: 'https://'
    condition: selection
falsepositives:
    - Unlikely
level: high
