title: SparroWocky Persistence Service Creation
id: c46f731a-e837-4f81-a60d-71b3e8e2e92c
status: experimental
description: Detects the persistence mechanism of the SparroWocky backdoor, which creates a Windows service named 'ProcAuditManager' pointing to its payload.
references:
    - https://www.welivesecurity.com/en/eset-research/beware-sparrowock-backdoor-bites-commands-catch/
author: ioc-yara-daily (agentic)
date: 2024-10-16
tags:
    - attack.persistence
    - attack.t1543.003
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\SYSTEM\CurrentControlSet\Services\ProcAuditManager\ImagePath'
        Details|contains: '\ProgramData\Software\ProcAuditManager.exe'
    condition: selection
falsepositives:
    - Unlikely
level: high
