title: SparroWocky Service Execution
id: 87588b43-0c46-4c2f-b4b1-e2fd1f729226
status: experimental
description: Detects the execution of the SparroWocky backdoor via a service, identified by the parent process 'services.exe' and the specific command-line argument 's2'.
references:
    - https://www.welivesecurity.com/en/eset-research/beware-sparrowock-backdoor-bites-commands-catch/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.execution
    - attack.t1569.002
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\services.exe'
        CommandLine|endswith: ' s2'
    condition: selection
falsepositives:
    - Legitimate software using 's2' as a service argument, although unlikely.
level: high
