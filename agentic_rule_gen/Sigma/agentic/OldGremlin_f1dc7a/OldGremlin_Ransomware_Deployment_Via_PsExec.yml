title: OldGremlin Ransomware Deployment via PsExec
id: 56934509-c5c6-4d2b-a320-c26ff38a2e1d
status: experimental
description: Detects the deployment of OldGremlin's custom ransomware 'TinyCryptor' via the PsExec utility, often leveraged through Cobalt Strike.
references:
    - https://www.group-ib.com/blog/oldgremlin/
author: ioc-yara-daily (agentic)
date: 2026-10-24
tags:
    - attack.lateral_movement
    - attack.t1021.002
    - attack.impact
    - attack.t1486
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\PSEXESVC.exe'
        Image|endswith: '\TinyCryptor.exe'
    condition: selection
falsepositives:
    - Unlikely
level: critical
