title: UAT-11587 Antino Backdoor Persistence In Run Key
id: ab47285a-7b3b-4172-8869-7c45fcc3d17a
status: experimental
description: Detects the creation of a registry Run key value pointing to GatherOsState.exe within the Antino backdoor's staging directory, a technique used by UAT-11587 for persistence.
references:
    - https://blog.talosintelligence.com/china-nexus-uat-11587-targets-government-and-policy-organizations-across-asia-with-antino-backdoor/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.persistence
    - attack.t1547.001
    - detection.threat_hunting
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\Microsoft\Windows\CurrentVersion\Run'
        Details|contains: '\Windows GatherOSStateKit\GatherOsState.exe'
    condition: selection
falsepositives:
    - Unlikely
level: high
