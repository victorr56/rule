title: Qbot Payload Download URI
id: f4b1b3e8-5e8c-4d3f-a6d1-12c8b0a5f9a2
status: experimental
description: Detects a URI pattern used by Qbot to download its payload, which is often a DLL masquerading as a PNG file and located in a randomly named subdirectory.
references:
    - https://www.elastic.co/security-labs/threat-command/exploring-the-qbot-attack-pattern
author: ioc-yara-daily (agentic)
date: 2024-05-15
tags:
    - attack.command_and_control
    - attack.t1105
    - detection.threat_hunting
logsource:
    category: proxy
detection:
    selection:
        Url|re: '\/[a-zA-Z0-9]{7,}\/[a-zA-Z0-9]{1,2}\.png$'
        HttpMimeType|contains:
            - 'application/octet-stream'
            - 'application/x-msdownload'
    condition: selection
falsepositives:
    - Server misconfigurations where non-image files are served from URLs with a .png extension matching the pattern.
level: medium
