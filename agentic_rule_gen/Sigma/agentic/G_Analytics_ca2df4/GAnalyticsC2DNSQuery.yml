title: G-Analytics C2/Gate Domain DNS Query
id: 5cae7284-a10c-4384-9ff5-731393661eb1
status: experimental
description: Detects DNS queries for domains associated with the G-Analytics web skimmer family.
references:
    - https://www.group-ib.com/blog/g-analytics/
author: ioc-yara-daily (agentic)
date: 2026-10-24
tags:
    - attack.exfiltration
    - attack.t1041
    - attack.command_and_control
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName|endswith:
            - '.dittm.org'
            - '.jquery-js.com'
            - '.g-analytics.com'
            - '.iozoz.com'
            - '.google-analytics.cm'
            - '.analytic.is'
            - '.googlc-analytics.cm'
            - '.cardz.vc'
            - '.cardz.su'
    condition: selection
falsepositives:
    - Unlikely.
level: high
