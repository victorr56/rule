title: Suspicious DNS Queries Linked to FakeSecurity/Vidar Campaigns
id: 64f78de2-8703-4903-8839-50eb93822299
status: experimental
description: Detects DNS queries to domains associated with FakeSecurity JS-sniffer, Vidar stealer distribution, and related C2 infrastructure.
references:
    - https://www.group-ib.com/blog/fakesecurity/
author: ioc-yara-daily (agentic)
date: 2026-10-24
tags:
    - attack.command_and_control
    - attack.t1071
    - detection.threat_hunting
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName|endswith:
            - '.magento-security.org'
            - '.fiswedbesign.com'
            - '.alloaypparel.com'
            - '.firstofbanks.com'
            - '.chuxagama.com'
            - '.umbra-diego.com'
    condition: selection
falsepositives:
    - Unlikely
level: high
