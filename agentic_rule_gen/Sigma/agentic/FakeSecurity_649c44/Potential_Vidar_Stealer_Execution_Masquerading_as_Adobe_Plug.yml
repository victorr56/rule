title: Potential Vidar Stealer Execution Masquerading as Adobe Plugin
id: 7e735165-4fbb-47dd-81b3-4f9e15967812
status: experimental
description: Detects the execution of a file masquerading as an Adobe Reader PDF Plugin, a pattern observed in Vidar stealer distribution linked to the FakeSecurity campaign.
references:
    - https://www.group-ib.com/blog/fakesecurity/
author: ioc-yara-daily (agentic)
date: 2026-10-24
tags:
    - attack.execution
    - attack.t1204.002
    - attack.defense_evasion
    - attack.t1036.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|startswith: 'Adobe-Reader-PDF-Plugin-'
        Image|endswith: '.exe'
    condition: selection
falsepositives:
    - Unlikely, this is not a legitimate Adobe naming convention.
level: high
