title: Lokibot/AZORult C2 Panel Access
id: a1c93a9b-75e1-4c6e-826a-93f9ef21b16c
status: experimental
description: Detects HTTP GET or POST requests to URL paths characteristic of Lokibot and AZORult C2 panels, as seen in campaigns distributing Vidar for the FakeSecurity operation.
references:
    - https://www.group-ib.com/blog/fakesecurity/
author: ioc-yara-daily (agentic)
date: 2026-10-24
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection_loki:
        Url|contains: '/Panel/five/PvqDq929BSx_A_D_M1n_a.php'
        Http.Method:
            - 'GET'
            - 'POST'
    selection_azor:
        Url|contains|all:
            - '/web-obtain/Panel/five/'
            - 'index.php'
        Http.Method:
            - 'GET'
            - 'POST'
    condition: 1 of selection_*
falsepositives:
    - Unlikely due to the specificity of the URL paths.
level: high
