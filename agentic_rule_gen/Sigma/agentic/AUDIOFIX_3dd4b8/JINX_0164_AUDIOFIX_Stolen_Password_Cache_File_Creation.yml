title: JINX-0164 AUDIOFIX Stolen Password Cache File Creation
id: 7e6f5c4b-3a2d-4e1f-8b9c-0d1e2f3a4b5c
status: experimental
description: Detects the creation of a cache file in the user's home directory, used by AUDIOFIX to store stolen macOS passwords.
references:
    - https://www.wiz.io/blog/threat-actors-target-crypto-orgs
author: ioc-yara-daily (agentic)
date: 2023-10-17
tags:
    - attack.collection
    - attack.t1005
    - attack.credential_access
    - attack.t1555
logsource:
    category: file_event
    product: macos
detection:
    selection:
        Image: '/Users/Shared/. Terrasse/Terrasse'
        TargetFilename|endswith: '/.zsh_cache'
    condition: selection
falsepositives:
    - Unlikely
level: high
