title: Potential Chrome Credential Looter ElevationKatz
id: 6e9e19d7-8ec9-4674-8854-e0eb8d79313a
status: experimental
description: 'Detects the execution of a Chromium-based browser with remote debugging flags, which is a technique used by tools like ElevationKatz (ChromeKatz) to bypass App-Bound Encryption and steal cookies. REVSTEALER is known to use this technique.'
references:
    - https://www.elastic.co/security-labs/threat-command/revstealer-credential-harvesting-infostealer
    - https://github.com/Flangvik/SharpCollection
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.credential_access
    - attack.t1555.003
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\brave.exe'
            - '\vivaldi.exe'
        CommandLine|contains|all:
            - '--no-sandbox'
            - '--remote-debugging-port='
    filter_legit_parent:
        ParentImage|endswith:
            - '\chrome.exe' # Relaunch
            - '\msedge.exe' # Relaunch
            - '\Code.exe'   # VSCode
            - '\devenv.exe' # Visual Studio
    condition: selection and not filter_legit_parent
falsepositives:
    - Web developers or QA engineers using these flags for legitimate debugging purposes.
level: medium
