title: REVSTEALER Gaming Credential Access
id: d7d9f94a-9d95-467f-8566-f5b248a31818
status: experimental
description: Detects access to various credential and session files related to gaming platforms such as Steam, Battle.net, Minecraft, and others. This is a common behavior of infostealers like REVSTEALER.
references:
    - https://www.elastic.co/security-labs/threat-command/revstealer-credential-harvesting-infostealer
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.credential_access
    - attack.t1555.003
    - detection.threat_hunting
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith:
            - '\Battle.net\Battle.net.config'
            - '\Battlestate Games\BsgLauncher\settings'
            - '\Roblox\LocalStorage\RobloxCookies.dat'
            - '\Steam\local.vdf'
            - '\Steam\loginusers.vdf'
            - '\.minecraft\launcher_accounts.json'
            - '\.minecraft\launcher_profiles_microsoft_store.json'
            - '\.minecraft\TlauncherProfiles.json'
            - '\.minecraft\meteor-client\accounts.nbt'
            - '\.minecraft\Impact\alts.json'
            - '\.feather\accounts.json'
            - '\Badlion Client\accounts.json'
            - '\.lunarclient\settings\game\accounts.json'
            - '\intentlauncher\launcherconfig'
        Image|contains:
            - '\AppData\Local\Temp\'
            - '\AppData\Roaming\'
            - '\Windows\Temp\'
            - '\Users\Public\'
    filter_legit_apps:
        Image|endswith:
            - '\Battle.net.exe'
            - '\BsgLauncher.exe'
            - '\EADesktop.exe'
            - '\RobloxPlayerBeta.exe'
            - '\Steam.exe'
            - '\MinecraftLauncher.exe'
            - '\Lunar Client.exe'
            - '\Feather Client.exe'
    condition: selection and not filter_legit_apps
falsepositives:
    - Backup software.
    - Other game launchers or mod managers not included in the filter.
level: medium
