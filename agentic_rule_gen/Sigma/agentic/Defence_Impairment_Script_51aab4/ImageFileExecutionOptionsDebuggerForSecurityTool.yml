title: Image File Execution Options Debugger for Security Tool
id: e880e071-3310-44be-ac11-0c675be8c0ed
status: experimental
description: Detects the use of Image File Execution Options (IFEO) to set a debugger for a security-related process (e.g., sysmon.exe, filebeat.exe), effectively disabling it.
references:
    - https://www.huntress.com/blog/mimikatz-credential-dumping-defence-impairment
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.defense_evasion
    - attack.t1546.012
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains: '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\'
        TargetObject|endswith:
            - '\sysmon.exe\Debugger'
            - '\filebeat.exe\Debugger'
            - '\cyserver.exe\Debugger'
    condition: selection
falsepositives:
    - Unlikely.
level: high
