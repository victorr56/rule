title: Enable WDigest UseLogonCredential For Credential Caching
id: 5a77c8e6-7586-4fa2-944f-b64ec4d97dd9
status: experimental
description: Detects modification of the registry to enable WDigest credential caching. This allows for plaintext credentials to be stored in memory, facilitating credential dumping.
references:
    - https://www.huntress.com/blog/mimikatz-credential-dumping-defence-impairment
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.credential_access
    - attack.t1552.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest\UseLogonCredential'
        Details: '1'
    condition: selection
falsepositives:
    - Legitimate diagnostic or administrative activities, though rare.
level: high
