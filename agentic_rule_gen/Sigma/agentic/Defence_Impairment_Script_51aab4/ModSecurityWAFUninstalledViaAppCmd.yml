title: ModSecurity WAF Uninstalled Via AppCmd
id: f547c1b1-2e21-4d92-95f0-6ed6c253bce7
status: experimental
description: Detects the use of appcmd.exe to uninstall the ModSecurity Web Application Firewall (WAF) module from IIS.
references:
    - https://www.huntress.com/blog/mimikatz-credential-dumping-defence-impairment
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.defense_evasion
    - attack.t1562
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\inetsrv\appcmd.exe'
        CommandLine|contains|all:
            - 'uninstall module'
            - 'ModSecurity IIS'
    condition: selection
falsepositives:
    - Legitimate uninstallation of the ModSecurity module, which should be a planned and authorized activity.
level: high
