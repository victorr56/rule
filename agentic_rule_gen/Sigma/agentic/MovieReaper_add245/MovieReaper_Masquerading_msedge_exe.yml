title: MovieReaper Masquerading as msedge.exe in ProgramData
id: 5b4e747b-7b3b-4c1d-b8d4-63d1a08b6b29
status: experimental
description: Detects the execution of 'msedge.exe' from the '%ProgramData%\Microsoft\Windows\Telemetry' directory. This is an anomalous location for this executable and is a known behavior of the MovieReaper malware, which uses this path for persistence and UAC bypass.
references:
    - https://securelist.com/moviereaper-malware-torrent-odyssey-solana/121344/
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.t1036.005
    - attack.t1548.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\msedge.exe'
        Image|contains: '\Microsoft\Windows\Telemetry\'
    condition: selection
falsepositives:
    - Unlikely. Legitimate versions of msedge.exe are not installed or run from this directory.
level: critical
