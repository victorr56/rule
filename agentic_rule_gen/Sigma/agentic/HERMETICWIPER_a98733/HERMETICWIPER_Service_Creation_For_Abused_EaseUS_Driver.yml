title: HERMETICWIPER Service Creation For Abused EaseUS Driver
id: 5a97bc3a-9669-42b7-a35b-163f538e1215
status: experimental
description: >-
  Detects the creation of a Windows service pointing to the EaseUS Partition Manager
  driver 'epmntdrv.sys'. This technique is used by the HERMETICWIPER malware to load a
  legitimate, signed driver that grants it raw disk access for destructive operations.
references:
  - https://www.elastic.co/security-labs/threat-command/elastic-protects-against-data-wiper-malware-targeting-ukraine-hermeticwiper
author: ioc-yara-daily (agentic)
date: 2026-10-25
tags:
  - attack.execution
  - attack.t1543.003
  - attack.privilege_escalation
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\sc.exe'
    CommandLine|contains|all:
      - 'create'
      - 'binPath='
      - 'epmntdrv.sys'
  condition: selection
falsepositives:
  - Legitimate installation or system administration involving EaseUS Partition Manager, although this is typically performed by a setup executable rather than a manual service creation via command line.
level: high
