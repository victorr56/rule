title: CyberXero Script Execution on Windows 'abuse_monitor.py'
id: a0b1c2d3-e4f5-4a6b-7c8d-9e0f1a2b3c4d
status: experimental
description: Detects the execution of a Python script named 'abuse_monitor.py' on Windows, which is associated with the CyberXero threat actor.
references:
    - https://socradar.io/blog/dark-web-profile-cyberxero/
author: ioc-yara-daily (agentic)
date: 2026-11-11
tags:
    - attack.execution
    - attack.t1059.006
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith:
            - '\python.exe'
            - '\python3.exe'
        CommandLine|contains: 'abuse_monitor.py'
    condition: selection
falsepositives:
    - Unlikely
level: high
