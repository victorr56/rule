title: CyberXero Persistence via 'UpdSvc' Service
id: e5f0b5d9-7d8a-4c9f-8e3b-9a0b1c2d3e4f
status: experimental
description: Detects the creation of a Windows service named 'UpdSvc', a technique used by the CyberXero threat actor for persistence.
references:
    - https://socradar.io/blog/dark-web-profile-cyberxero/
author: ioc-yara-daily (agentic)
date: 2026-11-11
tags:
    - attack.persistence
    - attack.t1543.003
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\sc.exe'
        CommandLine|contains|all:
            - 'create'
            - 'UpdSvc'
    condition: selection
falsepositives:
    - Legitimate software that may use this service name, though it is not common.
level: high
