title: BPFDoor/AVERAT Payload Staging To /sbin
id: 6100914e-d98c-4f18-8ce1-b84497e5950d
status: experimental
description: Detects the staging of BPFDoor/AVERAT payloads by copying them from an appliance-specific path to a system binary path like /sbin. This activity is orchestrated by a dropper script.
references:
    - https://www.rapid7.com/blog/post/tr-smtp-is-the-key-bpfdoor-averat-hitting-the-network-edge
author: ioc-yara-daily (agentic)
date: 2024-07-24
tags:
    - attack.execution
    - attack.t1059.004
    - attack.defense_evasion
    - attack.t1036.005
logsource:
    category: process_creation
    product: linux
detection:
    selection_update:
        Image|endswith: '/cp'
        CommandLine|contains|all:
            - '/addpkg/sbin/update'
            - '/sbin/ntpdate'
    selection_agetty:
        Image|endswith: '/cp'
        CommandLine|contains|all:
            - '/addpkg/sbin/agetty'
            - '/sbin/udevds'
    condition: 1 of selection_*
falsepositives:
    - Unlikely
level: high
