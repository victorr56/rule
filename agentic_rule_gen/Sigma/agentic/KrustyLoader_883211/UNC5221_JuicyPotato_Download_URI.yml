title: UNC5221 JuicyPotato/SweetPotato Download URI
id: 978939c0-6b68-45b7-a3f2-841ac66a5e18
status: experimental
description: Detects the command line used to download a SweetPotato variant with a specific URI path, as observed in UNC5221 campaigns.
references:
    - https://www.darktrace.com/blog/tracking-cve-2025-31324-darktraces-detection-of-sap-netweaver-exploitation-before-and-after-disclosure
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.command_and_control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - '/xmrigCCall/'
            - '/s.exe'
    condition: selection
falsepositives:
    - Legitimate scripts that happen to use the same URI path fragments.
level: high
