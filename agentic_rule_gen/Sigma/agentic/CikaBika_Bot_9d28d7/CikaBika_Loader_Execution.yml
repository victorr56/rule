title: CikaBika Bot Nim Loader Execution
id: f1a951d4-8d9e-4a6c-9407-f37803a08856
status: experimental
description: Detects the execution of the CikaBika Bot's Nim loader from a temporary file, as observed being launched by PowerShell via cmd.exe.
references:
    - https://www.darktrace.com/blog/cikabika-bot-inside-a-discord-rat
author: ioc-yara-daily (agentic)
date: 2026-11-02
tags:
    - attack.execution
    - attack.t1059.001
    - attack.t1059.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\powershell.exe'
        Image|endswith: '\cmd.exe'
        CommandLine|contains: '\IfyuUapz.txt'
    condition: selection
falsepositives:
    - Unlikely
level: high
