title: CikaBika Bot DLL Staging in Temp Directory
id: a8c62c93-5477-44f3-b035-64f3d2f9d854
status: experimental
description: Detects the creation of 'dbghelp.tmp' in the Windows Temp directory by 'flashplayer_setup.exe', a known staging method for the CikaBika Bot DLL.
references:
    - https://www.darktrace.com/blog/cikabika-bot-inside-a-discord-rat
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.defense_evasion
    - detection.threat_hunting
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\flashplayer_setup.exe'
        TargetFilename|endswith: '\Windows\Temp\dbghelp.tmp'
    condition: selection
falsepositives:
    - Unlikely, as Adobe Flash Player is end-of-life.
level: medium
