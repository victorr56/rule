title: CikaBika Bot Fallback DLL Load via Regsvr32
id: 5979f42b-586b-4c5b-8015-6ac31d51c3a6
status: experimental
description: Detects the use of regsvr32.exe to load the malicious 'dbghelp.dll', a fallback mechanism used by CikaBika Bot.
references:
    - https://www.darktrace.com/blog/cikabika-bot-inside-a-discord-rat
author: ioc-yara-daily (agentic)
date: 2026-11-02
tags:
    - attack.defense_evasion
    - attack.t1218.010
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32.exe'
        CommandLine|contains: 'dbghelp.dll'
    condition: selection
falsepositives:
    - Legitimate but uncommon software installation or repair scripts.
level: medium
