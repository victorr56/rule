title: BTR_CLI Proof-of-Concept Tool Execution
id: 546f2549-b5f2-4e0d-b0df-24a6fa16b1ad
status: experimental
description: Detects the execution of BTR_CLI.exe, a PoC tool that weaponizes the signed BTR.sys driver for arbitrary kernel-mode operations.
references:
    - https://research.checkpoint.com/2024/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/
author: ioc-yara-daily (agentic)
date: 2024-05-28
tags:
    - attack.defense_evasion
    - attack.privilege_escalation
    - attack.t1548
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection_item:
        Image|endswith: '\BTR_CLI.exe'
        CommandLine|contains|all:
            - '-item '
            - '|' # The pipe is used as a delimiter for item type and value, e.g., "4|HKLM..."
            - '-trigger'
    # Example: BTR_CLI.exe -a 3 -s "C:\Users\..\mimidrv.sys" -d "C:\Windows\System32\drivers\mimidrv.sys"
    selection_action:
        Image|endswith: '\BTR_CLI.exe'
        CommandLine|contains|all:
            - '-a '
            - '-s '
            - '-d '
    condition: 1 of selection_*
falsepositives:
    - Unlikely, the tool name and command-line structure are specific to this PoC.
level: high
