title: NetSupport Manager Delivery via Masqueraded msIeXec.exe
id: bdfa3d46-41e9-4e78-bc5a-bd5b96a84920
status: experimental
description: Detects the execution of a masqueraded `msIeXec.exe` (a typo of msiexec.exe) with command-line arguments characteristic of a NetSupport Manager delivery chain.
references:
    - https://redcanary.com/blog/threat-intelligence/intelligence-insights-june-2024/
author: ioc-yara-daily (agentic)
date: 2024-06-20
tags:
    - attack.execution
    - attack.t1218.007
    - attack.defense_evasion
    - attack.t1036.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\msIeXec.exe'
        CommandLine|contains|all:
            - '-PAcK'
            - '/Cpcha'
            - '/Q'
    condition: selection
falsepositives:
    - Unlikely
level: high
