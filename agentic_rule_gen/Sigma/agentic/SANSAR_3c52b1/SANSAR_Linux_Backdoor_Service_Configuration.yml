title: SANSAR Linux Backdoor Service Configuration
id: 8c12a7a9-95e2-45e0-82a0-4ff6796c5685
status: experimental
description: Detects attempts to enable or start the 'netns' systemd service, which is the backdoor component of the SANSAR malware toolkit.
references:
    - https://www.elastic.co/security-labs/threat-command/sansar-linux-cryptomining-malware
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.persistence
    - attack.t1543.002
    - detection.threat_hunting
logsource:
    category: process_creation
    product: linux
detection:
    selection_start:
        Image|endswith: '/systemctl'
        CommandLine|contains|all:
            - 'start'
            - 'netns.service'
    selection_enable:
        Image|endswith: '/systemctl'
        CommandLine|contains|all:
            - 'enable'
            - 'netns.service'
    condition: 1 of selection_*
falsepositives:
    - Legitimate services named 'netns'.
level: high
