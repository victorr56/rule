title: Kali365 OctoLink Tool Execution
id: 5543cbe2-6750-4fc7-9e0a-04bd2be6c672
status: experimental
description: Detects the execution of Kali365 companion desktop applications, OctoLink Live and OctoLink Sender, used for session replay and mass-mailing.
references:
    - https://www.huntress.com/blog/kali365-device-code-phishing-kit
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.initial_access
    - attack.t1566
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\OctoLink Live.exe'
            - '\OctoLink Sender.exe'
        OriginalFileName:
            - 'OctoLink Live.exe'
            - 'OctoLink Sender.exe'
    condition: selection
falsepositives:
    - Unlikely
level: high
