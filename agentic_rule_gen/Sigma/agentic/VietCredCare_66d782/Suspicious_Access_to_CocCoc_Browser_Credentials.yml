title: Suspicious Access to CocCoc Browser Credentials
id: c488f561-bd8c-4a37-b4d6-84c1f96409e6
status: experimental
description: Detects a non-browser process accessing sensitive credential and cookie files of the CocCoc browser. This behavior is associated with stealers like VietCredCare targeting users in Vietnam.
references:
    - https://www.group-ib.com/blog/vietcredcare-stealer/
author: ioc-yara-daily (agentic)
date: 2026-10-18
tags:
    - attack.credential_access
    - attack.t1555
    - attack.t1539
logsource:
    category: file_event
    product: windows
detection:
    selection_access:
        TargetFilename|contains:
            - '\AppData\Local\CocCoc\Browser\User Data\'
        TargetFilename|endswith:
            - '\Login Data'
            - '\Cookies'
            - '\Web Data'
            - '\History'
            - '\Local State'
    filter_legit:
        Image|endswith:
            - '\coccoc.exe'
            - '\browser_broker.exe'
    condition: selection_access and not filter_legit
falsepositives:
    - Legitimate third-party tools for browser data migration or backup.
level: high
