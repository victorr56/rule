title: REF1695/SilentCryptoMiner Execution From Masquerade Path
id: 792b1579-0522-48f8-b11c-d7e7c9367d3e
status: experimental
description: Detects the execution of SilentCryptoMiner from its specific installation path "AppData\Local\OptimizeMS\optims.exe" with command-line arguments typical of cryptomining.
references:
    - https://www.elastic.co/security-labs/threat-command/fake-installers-to-monero
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.execution
    - attack.t1204.002
    - attack.resource_hijacking
    - attack.t1496
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\OptimizeMS\optims.exe'
        CommandLine|contains: '--donate-level'
    condition: selection
falsepositives:
    - Legitimate cryptomining activity, if any, is not expected to use this specific installation path.
level: high
