title: UAC Bypass Attempt via SilentCleanup Task Execution
id: c4b986cc-e70a-4a69-8aa5-e9df259e8f19
status: experimental
description: Detects the manual execution of the 'SilentCleanup' scheduled task, often from a command prompt or script. This is a common preparatory step in a UAC bypass technique where an attacker triggers the task to leverage an elevated process for malicious actions.
references:
    - https://www.elastic.co/security-labs/threat-command/exploring-windows-uac-bypasses-techniques-and-detection-strategies
author: ioc-yara-daily (agentic)
date: 2026-10-25
tags:
    - attack.privilege_escalation
    - attack.defense_evasion
    - attack.t1548.002
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/run'
            - '\Microsoft\Windows\DiskCleanup\SilentCleanup'
    condition: selection
falsepositives:
    - Legitimate administrative scripts might trigger this task, but it is unusual from an interactive parent process.
level: medium
