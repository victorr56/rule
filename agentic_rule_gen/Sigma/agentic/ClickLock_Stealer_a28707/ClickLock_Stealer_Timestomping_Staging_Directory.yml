title: ClickLock Stealer Timestomping Staging Directory
id: f456a1b2-c0e8-46a3-bd5b-e48f76e771d9
status: experimental
description: Detects timestomping of the malware's staging directory '.cacheb' to match the modification time of the user's Movies folder, a defense evasion technique.
references:
    - https://www.group-ib.com/blog/clicklock-stealer-macos-malware/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.defense_evasion
    - attack.t1070.006
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/touch'
        CommandLine|contains|all:
            - '-r'
            - '/Movies'
            - '/.cacheb'
    condition: selection
falsepositives:
    - Unlikely
level: medium
