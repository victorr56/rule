title: ClickLock Stealer macOS Password Validation
id: 9a8c1f9e-a81d-400a-810a-2007e0f274a2
status: experimental
description: Detects the use of `dscl -authonly` to validate a captured user password, a technique used by ClickLock Stealer.
references:
    - https://www.group-ib.com/blog/clicklock-stealer-macos-malware/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.credential_access
    - attack.t1552
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/dscl'
        CommandLine|contains|all:
            - '/Local/Default'
            - '-authonly'
    condition: selection
falsepositives:
    - Highly specialized administrative scripts might use this command, but it is rare in typical environments.
level: high
