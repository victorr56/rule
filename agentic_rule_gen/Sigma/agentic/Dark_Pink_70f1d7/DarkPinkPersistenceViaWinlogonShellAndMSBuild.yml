title: Dark Pink Persistence via Winlogon Shell and MSBuild
id: 1f2e3d4c-5b6a-4d7e-8c9b-0a1b2c3d4e5f
status: experimental
description: Detects modification of the "Winlogon\Shell" registry key to execute "MSBuild.exe", a persistence technique used by the Dark Pink APT's KamiKakaBot.
references:
    - https://www.group-ib.com/blog/dark-pink-apt/
author: ioc-yara-daily (agentic)
date: 2026-10-22
tags:
    - attack.persistence
    - attack.t1547.001
    - detection.threat_hunting
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\CurrentVersion\Winlogon\Shell'
        Details|contains|all:
            - 'MSBuild.exe'
            - '.xml'
    condition: selection
falsepositives:
    - Other malware families might use a similar technique. Legitimate modification to this value is rare, especially in the HKCU hive.
level: high
