title: Dark Pink 'Microsoft Idle' Scheduled Task Creation
id: c7d6e5f4-a3b9-4c2d-8f7a-6b5c4d1e9f8a
status: experimental
description: Detects the creation of a scheduled task named "Microsoft Idle" via schtasks.exe, a technique used by Dark Pink for persistence.
references:
    - https://www.group-ib.com/blog/dark-pink-apt/
author: ioc-yara-daily (agentic)
date: 2026-10-22
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053.005
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/tn "Microsoft Idle"'
    condition: selection
falsepositives:
    - Unlikely, but other tools could potentially use this name.
level: medium
