title: RansomHub Execution With SecretServerSecretStealer Script
id: dc912443-bd21-4fce-906d-a7dafd4658e3
status: experimental
description: Detects the execution of the "SecretServerSecretStealer" PowerShell script, used by RansomHub affiliates for password decryption.
references:
    - https://www.darktrace.com/blog/ransomhub-revisited-new-front-runner-in-the-ransomware-as-a-service-marketplace
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.credential_access
    - attack.t1555
    - detection.threat_hunting
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: 'SecretServerSecretStealer'
    condition: selection
falsepositives:
    - Unlikely
level: high
