title: KREMLIN Headless Node.js Execution
id: 28f6e80b-93f5-47e1-b4f0-4660e1d033c5
status: experimental
description: Detects the execution of Node.js in headless mode via conhost.exe, a technique used by KREMLIN malware as part of its execution chain.
references:
    - https://www.elastic.co/security-labs/threat-command/malicious-browser-extension-kremlin-banking-malware
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.execution
    - attack.t1059.007
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\conhost.exe'
        ParentCommandLine|contains: ' --headless '
        Image|endswith: '\node.exe'
    condition: selection
falsepositives:
    - Legitimate applications that might use Node.js in a headless conhost session.
level: medium
