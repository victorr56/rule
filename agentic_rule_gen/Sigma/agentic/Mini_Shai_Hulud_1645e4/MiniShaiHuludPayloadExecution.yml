title: Mini Shai-Hulud Payload Execution
id: f3099951-4091-447a-9092-4f36616010e6
status: experimental
description: Detects the execution of the Mini Shai-Hulud installer script, typically triggered by a `preinstall` hook in a malicious npm package.
references:
    - https://www.wiz.io/blog/mini-shai-hulud-strikes-again-tanstack-more-npm-packages-compromised
author: ioc-yara-daily (agentic)
date: 2026-10-17
tags:
    - attack.execution
    - attack.t1059.007
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\node.exe'
        CommandLine|contains: ' setup.mjs'
    condition: selection
falsepositives:
    - Legitimate but uncommon execution of a file named 'setup.mjs' with Node.js.
level: high
