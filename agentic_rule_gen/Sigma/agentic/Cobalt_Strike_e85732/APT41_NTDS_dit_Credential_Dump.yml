title: APT41 NTDS.dit Credential Dump
id: a2578505-180b-4171-aa3a-446755498877
status: experimental
description: Detects the command line used by APT41 to dump the Active Directory database (NTDS.dit) using ntdsutil.exe.
references:
    - https://www.group-ib.com/blog/apt41-world-tour-2021/
author: ioc-yara-daily (agentic)
date: 2026-10-23
tags:
    - attack.credential_access
    - attack.t1003.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\ntdsutil.exe'
        CommandLine|contains|all:
            - 'ac i ntds'
            - 'ifm'
            - 'create full C:\perflogs\temp'
    condition: selection
falsepositives:
    - Legitimate administrative activity, though the exact command line and temporary path are uncommon for benign use.
level: high
