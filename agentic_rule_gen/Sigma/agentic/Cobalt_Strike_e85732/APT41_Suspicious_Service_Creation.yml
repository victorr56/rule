title: APT41 Suspicious Service Creation
id: 48d0b25d-2b47-4974-9f89-8d754f910408
status: experimental
description: Detects the creation of suspicious services by name, a technique used by APT41 for persistence.
references:
    - https://www.group-ib.com/blog/apt41-world-tour-2021/
author: ioc-yara-daily (agentic)
date: 2024-06-25
tags:
    - attack.persistence
    - attack.t1543.003
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|startswith: 'HKLM\SYSTEM\CurrentControlSet\Services\'
        TargetObject|endswith:
            - '\Exec2022'
            - '\SuperIe'
            - '\LxpSrvc'
    condition: selection
falsepositives:
    - Unlikely
level: high
