title: Node2Shell Payload C2 URL Request
id: f1c385f0-6c99-4d6d-8b6b-80155b11c911
status: experimental
description: Detects HTTP requests for specific URLs known to be used for hosting Node2Shell/HTTP2Shell payloads.
references:
    - https://socprime.com/blog/node2shell-http2shell-detection/
author: ioc-yara-daily (agentic)
date: 2026-11-04
tags:
    - attack.command_and_control
    - attack.t1105
logsource:
    category: proxy
detection:
    selection_sh:
        DestinationIp: '198.51.100.23'
        Url|endswith: '/s.sh'
    selection_api:
        DestinationIp: '198.51.100.23'
        Url|endswith: '/api/w'
    condition: 1 of selection_*
falsepositives:
    - Legitimate requests to this IP and URI path combination are highly unlikely.
level: high
