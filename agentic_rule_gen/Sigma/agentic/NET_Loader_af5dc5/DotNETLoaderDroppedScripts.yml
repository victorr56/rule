title: Suspicious JScript or PowerShell Execution from Public Directory
id: 9a613d9f-a2e6-42d8-9990-2e45343cc7c7
status: experimental
description: Detects the execution of specific JScript and PowerShell files from the C:\Users\Public directory, which are known to be dropped by a .NET loader.
references:
    - https://www.huntress.com/blog/malspam-to-loader-delivery-chain-analysis
author: ioc-yara-daily (agentic)
date: 2024-06-25
tags:
    - attack.execution
    - attack.t1059.007
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_js:
        Image|endswith: '\wscript.exe'
        CommandLine|contains: '\Public\ktncm.js'
    selection_ps_classic:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: '\Public\nlbzl.ps1'
    selection_ps_core:
        Image|endswith: '\pwsh.exe'
        CommandLine|contains: '\Public\nlbzl.ps1'
    condition: 1 of selection_*
falsepositives:
    - Unlikely
level: high
