title: Masqueraded Mega Client Exfiltration
id: c3dd0225-b461-4560-a24c-9f6974e4c2be
status: experimental
description: Detects a process masquerading as 'ms_edge.exe' executing command-line arguments specific to the MEGAcmd client, a technique used by REF0657 for data exfiltration.
references:
    - https://www.elastic.co/security-labs/threat-command/unmasking-financial-services-intrusion-ref0657
author: ioc-yara-daily (agentic)
date: 2026-10-18
tags:
    - attack.exfiltration
    - attack.t1567.002
    - attack.defense_evasion
    - attack.t1036.005
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\ms_edge.exe'
        CommandLine|contains|all:
            - 'copy'
            - 'mega_temp:'
    filter:
        Image|startswith:
            - 'C:\Program Files\Microsoft\Edge\Application\'
            - 'C:\Program Files (x86)\Microsoft\Edge\Application\'
    condition: selection and not filter
falsepositives:
    - Unlikely
level: high
