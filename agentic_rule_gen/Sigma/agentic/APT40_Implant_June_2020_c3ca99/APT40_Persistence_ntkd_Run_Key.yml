title: APT40 Persistence via 'ntkd' Run Key
id: e38e4a8b-1e0f-48d8-bb88-3487f941f173
status: experimental
description: Detects the creation of a registry run key with the value name 'ntkd' pointing to oci.dll, a persistence method used by an APT40 implant as observed in a campaign targeting Malaysian entities.
references:
    - https://www.elastic.co/security-labs/threat-command/advanced-techniques-used-in-malaysian-focused-apt-campaign
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\Software\Microsoft\Windows\CurrentVersion\Run\ntkd'
        Details|contains|all:
            - 'regsvr32.exe'
            - '\Oracle\'
            - 'oci.dll'
    condition: selection
falsepositives:
    - Legitimate software using the same registry value name and file names, although the combination is unlikely.
level: high
