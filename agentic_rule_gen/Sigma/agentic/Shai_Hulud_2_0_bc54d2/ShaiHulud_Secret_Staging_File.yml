title: Shai-Hulud 2.0 Secret Staging File Creation
id: 99a2c3d4-b7e8-4c6f-a1b1-f3a7d9b0e1e2
status: experimental
description: Detects the creation of specific JSON files used by Shai-Hulud 2.0 to stage stolen secrets before exfiltration.
references:
    - https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack
author: ioc-yara-daily (agentic)
date: 2026-10-22
tags:
    - attack.credential_access
    - attack.t1552.001
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        TargetFilename|endswith:
            - '\actionsSecrets.json'
            - '\truffleSecrets.json'
    condition: selection
falsepositives:
    - Legitimate security audit scripts running via PowerShell.
level: high
