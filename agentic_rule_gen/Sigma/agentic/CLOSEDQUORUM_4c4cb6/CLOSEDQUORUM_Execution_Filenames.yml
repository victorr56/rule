title: CLOSEDQUORUM Build Filename Execution
id: 5418b76d-1b91-4e78-bfe3-94c6579227c8
status: experimental
description: Detects the execution of processes with filenames 'gohno-final.exe' or 'earlyburb.exe', which are known build names for the CLOSEDQUORUM malware.
references:
    - https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/
author: ioc-yara-daily (agentic)
date: 2024-06-19
tags:
    - attack.execution
    - attack.t1036.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\gohno-final.exe'
            - '\earlyburb.exe'
        Image|startswith:
            - 'C:\Users\'
            - 'C:\ProgramData\'
            - 'C:\Windows\Temp\'
            - 'C:\Temp\'
    condition: selection
falsepositives:
    - Unlikely due to the specific and non-standard filenames.
level: high
