title: Deimos Persistence with Hardcoded LNK Filename
id: b3dfb202-a279-450f-a10c-34d3e8e195a6
status: experimental
description: Detects the creation of a specific .LNK file in the user's Startup folder, a technique used by the Deimos implant for persistence.
references:
    - https://www.elastic.co/security-labs/threat-command/going-coast-to-coast-climbing-the-pyramid-with-the-deimos-implant
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|contains: '\Programs\Startup\'
        TargetFilename|endswith: '\a44f066dfa44db9fba953a982d48b.lnk'
    condition: selection
falsepositives:
    - Unlikely
level: critical
