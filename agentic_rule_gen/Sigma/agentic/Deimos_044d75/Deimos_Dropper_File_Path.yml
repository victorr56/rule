title: Deimos Dropper File Path Pattern
id: 3c271777-6ef7-4589-a294-0f1e03a985d8
status: experimental
description: Detects the creation of files by a PyInstaller-based loader in a highly specific path structure used by the Deimos implant. The path consists of a sequence of six 32-character hexadecimal string directories under the user's profile. The payload files are named 'wwanpro.dll', 'wwanconn.dll', or a 32-character hexadecimal string.
references:
    - https://www.elastic.co/security-labs/threat-command/going-coast-to-coast-climbing-the-pyramid-with-the-deimos-implant
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.defense_evasion
    - attack.t1027
    - detection.threat_hunting
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|contains: '\_MEI'
        TargetFilename|re: 'C:\\Users\\[^\\]+\\([a-f0-9]{32}\\){6}(?:[a-f0-9]{32}|wwanpro\.dll|wwanconn\.dll)'
    condition: selection
falsepositives:
    - Legitimate software packaged with PyInstaller, although the file path structure is highly specific to Deimos.
level: high
