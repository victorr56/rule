title: Tick ShadowPad Service Creation With Typo
id: 112fdf84-c5a4-4f22-901b-c689d070b4a7
status: experimental
description: Detects the creation of a Windows service with a misspelled name, a technique used by a ShadowPad variant deployed by the Tick threat actor for persistence.
references:
    - http://nao-sec.org/2024/06/building-caspers-shadow.html
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.persistence
    - attack.t1543.003
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\sc.exe'
        CommandLine|contains|all:
            - 'create'
            - 'Microsof t .NETClickOnceLaunchUtility' # Note space in 'Microsof t'
    condition: selection
falsepositives:
    - Unlikely
level: high
