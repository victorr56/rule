title: E1RB Skimmer URI Path
id: 9a20349a-e8d9-4b68-8097-d864115e5109
status: experimental
description: Detects POST requests to known data exfiltration URI paths used by the E1RB JavaScript skimmer.
references:
    - https://www.group-ib.com/blog/e1rb/
author: ioc-yara-daily (agentic)
date: 2024-05-23
tags:
    - attack.drive_by_compromise
    - attack.t1189
    - attack.exfiltration
    - attack.t1048
    - attack.collection
    - attack.t1119
    - detection.threat_hunting
logsource:
    category: proxy
detection:
    selection:
        Url|endswith:
            - '/diem/stat'
            - '/diem/track'
            - '/thredzonline/data'
        Method: 'POST'
    condition: selection
falsepositives:
    - Legitimate POST requests to these specific URI endpoints are highly unlikely.
level: high
