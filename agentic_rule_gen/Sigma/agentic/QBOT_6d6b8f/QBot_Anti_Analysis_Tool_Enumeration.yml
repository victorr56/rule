title: QBot Anti-Analysis Tool Enumeration
id: d4a3b2c1-0e9f-4a8b-9c6d-5e4f3a2b1c0d
status: experimental
description: Detects command line execution consistent with QBot checking for the presence of analysis and debugging tools using tasklist and findstr.
references:
    - https://www.elastic.co/security-labs/threat-command/qbot-malware-analysis
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.defense_evasion
    - attack.t1497.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_cmd:
        Image|endswith: '\cmd.exe'
        CommandLine|contains|all:
            - 'tasklist'
            - 'findstr'
    selection_tools:
        Image|endswith: '\cmd.exe'
        CommandLine|contains:
            - 'frida-winjector-helper-32'
            - 'frida-winjector-helper-64'
            - 'idaq64.exe'
            - 'joeboxserver.exe'
            - 'proc_analyzer.exe'
            - 'sniff_hit.exe'
            - 'sysAnalyzer.exe'
            - 'x64dbg.exe'
            - 'wireshark.exe'
    condition: all of selection_*
falsepositives:
    - Security researchers or system administrators may manually run these commands to check for the same tools.
level: medium
