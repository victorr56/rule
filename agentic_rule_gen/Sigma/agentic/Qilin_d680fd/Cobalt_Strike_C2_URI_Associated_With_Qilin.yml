title: Cobalt Strike C2 URI Associated With Qilin
id: 4a974b93-57f2-452f-a99f-7a42698ad4da
status: experimental
description: Detects C2 requests with URI paths seen in Cobalt Strike usage by Qilin affiliates.
references:
    - https://www.darktrace.com/blog/a-busy-agenda-darktraces-detection-of-qilin-ransomware-as-a-service-operator
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection_post:
        HttpMethod: 'POST'
        Url|endswith:
            - '/asdffHTTPS'
            - '/asdfgdf'
            - '/asdfgHTTP'
    selection_get:
        HttpMethod: 'GET'
        Url|endswith: '/download/sihost64.dll'
    condition: 1 of selection_*
falsepositives:
    - Legitimate traffic using the same URI path and HTTP method combination, though unlikely.
level: high
