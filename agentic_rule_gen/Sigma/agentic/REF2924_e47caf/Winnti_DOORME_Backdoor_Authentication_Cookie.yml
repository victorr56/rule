title: Winnti DOORME Backdoor Authentication Cookie
id: ddb9802d-639a-41e1-8848-ce267f53a152
status: experimental
description: Detects a specific cookie value used by the DOORME IIS backdoor for authentication.
references:
    - https://www.elastic.co/security-labs/threat-command/update-to-the-REF2924-intrusion-set-and-related-campaigns
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection:
        HttpCookie|contains: '79cfdd0e92b120faadd7eb253eb800d0'
        HttpMethod: 'POST'
    condition: selection
falsepositives:
    - Unlikely
level: critical
