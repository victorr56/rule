title: Lazarus SessionEnv Service Privilege Modification
id: 5790c5f9-f77d-4c3e-a86d-064e66249ed2
status: experimental
description: Detects modification of the SessionEnv service's RequiredPrivileges registry key to add SeDebugPrivilege or SeLoadDriverPrivilege. This is a preparatory step for phantom DLL loading used by a Lazarus subgroup.
references:
    - https://blog.fox-it.com/2025/09/01/three-lazarus-rats-coming-for-your-cheese/
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.privilege_escalation
    - attack.t1548.002
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\SYSTEM\CurrentControlSet\Services\SessionEnv\RequiredPrivileges'
        Details|contains:
            - 'SeDebugPrivilege'
            - 'SeLoadDriverPrivilege'
    condition: selection
falsepositives:
    - Unlikely
level: high
