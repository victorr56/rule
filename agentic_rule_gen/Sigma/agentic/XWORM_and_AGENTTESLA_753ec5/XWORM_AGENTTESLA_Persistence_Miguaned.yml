title: XWORM/AGENTTESLA Persistence via Miguaned Scheduled Task
id: 2a92c018-b22a-4df4-a4b6-455b51b72b83
status: experimental
description: Detects the creation of a scheduled task named "miguaned" used by XWORM/AGENTTESLA to run a malicious JScript for updates and persistence.
references:
    - https://www.elastic.co/security-labs/threat-command/attack-chain-leads-to-xworm-and-agenttesla
author: ioc-yara-daily (agentic)
date: 2026-10-27
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/tn miguaned'
    condition: selection
falsepositives:
    - Unlikely
level: high
