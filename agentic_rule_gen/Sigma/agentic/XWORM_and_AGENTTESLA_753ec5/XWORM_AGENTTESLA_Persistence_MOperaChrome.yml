title: XWORM/AGENTTESLA Persistence via MOperaChrome Scheduled Task
id: 3c59e782-b7e3-4f10-90a6-560641b63dd1
status: experimental
description: Detects the creation of a scheduled task named "MOperaChrome" used by a loader for XWORM/AGENTTESLA to establish persistence.
references:
    - https://www.elastic.co/security-labs/threat-command/attack-chain-leads-to-xworm-and-agenttesla
author: ioc-yara-daily (agentic)
date: 2026-10-27
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/tn MOperaChrome'
    condition: selection
falsepositives:
    - Unlikely
level: high
