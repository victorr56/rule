title: Axios Supply-Chain RAT C2 DNS Query
id: 86b165b4-d558-4560-a292-15f928e19e07
status: experimental
description: Detects DNS queries for the 'sfrclak.com' domain, which is used as a command and control (C2) server by the Axios supply-chain RAT.
references:
    - https://www.elastic.co/security-labs/blog/axios-supply-chain-compromise-detections
author: ioc-yara-daily (agentic)
date: 2026-10-18
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName: 'sfrclak.com'
    condition: selection
falsepositives:
    - Unlikely
level: critical
