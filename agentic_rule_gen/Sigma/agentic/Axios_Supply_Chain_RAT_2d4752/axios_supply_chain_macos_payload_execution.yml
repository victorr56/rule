title: Axios Supply-Chain RAT macOS Payload Execution
id: f0d5e1f8-9a3b-48c5-9c94-81d3d633e889
status: experimental
description: Detects the execution of the macOS backdoor 'com.apple.act.mond' from a suspicious cache path, a behavior of the Axios supply-chain RAT.
references:
    - https://www.elastic.co/security-labs/blog/axios-supply-chain-compromise-detections
author: ioc-yara-daily (agentic)
date: 2026-10-18
tags:
    - attack.execution
    - attack.t1059.004
    - attack.t1204.002
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/Library/Caches/com.apple.act.mond'
        CommandLine|endswith: '/Library/Caches/com.apple.act.mond'
    condition: selection
falsepositives:
    - Unlikely
level: high
