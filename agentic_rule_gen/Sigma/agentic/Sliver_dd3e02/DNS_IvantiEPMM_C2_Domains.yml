title: DNS Queries for Ivanti EPMM Exploit C2 Domains
id: 792b0287-ba8e-49b0-bcde-3ed45a666e85
status: experimental
description: Detects DNS queries for domains known to be associated with command and control infrastructure used in the exploitation of Ivanti EPMM vulnerabilities (CVE-2025-4427, CVE-2025-4428).
references:
    - https://www.wiz.io/blog/ivanti-epmm-rce-vulnerability-chain-cve-2025-4427-cve-2025-4428
author: ioc-yara-daily (agentic)
date: 2026-10-23
tags:
    - attack.command_and_control
    - attack.t1071
logsource:
    category: dns_query
detection:
    selection:
        QueryName:
            - 'censysinspect.com'
            - 'e-wago.pl'
            - 'elektrobohater.pl'
            - 'wagodirect.pl'
    condition: selection
falsepositives:
    - These domains could be sinkholed or change ownership in the future.
level: high
