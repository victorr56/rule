title: GHOSTENGINE Scheduled Task Creation
id: 5218d6e7-cf68-45a8-9d8a-6b803f274a72
status: experimental
description: Detects the creation of scheduled tasks with names specific to the GHOSTENGINE malware.
references:
    - https://www.elastic.co/security-labs/threat-command/invisible-miners-unveiling-ghostengine
author: ioc-yara-daily (agentic)
date: 2024-06-21
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/tn'
        CommandLine|contains:
            - ' OneDriveCloudSync '
            - ' DefaultBrowserUpdate '
            - ' OneDriveCloudBackup '
    condition: selection
falsepositives:
    - Unlikely
level: high
