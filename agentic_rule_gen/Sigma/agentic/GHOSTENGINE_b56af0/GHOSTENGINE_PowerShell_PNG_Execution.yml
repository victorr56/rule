title: GHOSTENGINE PowerShell Execution of Disguised PNG File
id: e4b2b109-1a6f-42ae-8e0f-96a928e3b9fa
status: experimental
description: Detects PowerShell executing a file with a .png extension from the C:\Windows\Fonts directory, a TTP used by GHOSTENGINE.
references:
    - https://www.elastic.co/security-labs/threat-command/invisible-miners-unveiling-ghostengine
author: ioc-yara-daily (agentic)
date: 2026-10-18
tags:
    - attack.execution
    - attack.masquerading
    - attack.t1059.001
    - attack.t1036.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - '-File'
            - 'C:\Windows\Fonts\'
            - '.png'
    condition: selection
falsepositives:
    - Highly unlikely, as executing a PNG file via PowerShell is not standard behavior.
level: high
