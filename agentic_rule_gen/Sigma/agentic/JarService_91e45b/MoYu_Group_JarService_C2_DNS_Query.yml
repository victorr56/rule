title: MoYu Group JarService C2 DNS Query
id: f456a00f-d450-4ba4-bb2a-f111f185c7f8
status: experimental
description: Detects DNS queries for domains associated with the MoYu Group's JarService malware C2 infrastructure.
references:
    - https://securelist.com/android-head-unit-malware/121106/
author: ioc-yara-daily (agentic)
date: 2024-07-25
tags:
    - attack.command_and_control
    - attack.t1071
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName|endswith:
            - 'admin.uipoxy.com'
            - 'ishano456.sbs'
            - 'kookjar.com'
            - 'kshahnd.sbs'
            - 'mdsjhd.sbs'
            - 'nmnsny.sbs'
            - 'ty4523.space'
            - 'ty54fgd435.my'
            - 'ue886578433.online'
            - 'xmsae.sbs'
            - 'xshaon123.sbs'
    condition: selection
falsepositives:
    - Unlikely
level: high
