title: Jenkins Credential Access
id: 5698ab8c-1e24-42f7-ad54-8e392b51cc18
status: experimental
description: Detects access to Jenkins credentials pages using common command-line utilities like curl or wget. This could indicate an attacker attempting to steal credentials stored in the Jenkins instance programmatically.
references:
    - https://www.group-ib.com/blog/gitlab-jenkins-forensics/
author: ioc-yara-daily (agentic)
date: 2026-10-24
tags:
    - attack.credential_access
    - attack.t1552
logsource:
    category: proxy
detection:
    selection:
        Url.Path|contains|all:
            - '/credentials/store/'
            - '/credential/'
        UserAgent|re: '^(curl|Wget)\/'
    condition: selection
falsepositives:
    - Legitimate automation scripts may use command-line tools like curl or wget to access Jenkins credential stores via its API.
level: high
