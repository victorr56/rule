title: Suspicious Jenkins User File Creation
id: 9a9f2441-2b0e-4364-871f-0e78855426b3
status: experimental
description: Detects the creation of a user configuration file directly in the Jenkins 'users' directory with a pattern that might indicate manual or malicious user creation. Standard Jenkins user creation typically involves creating a subdirectory for the user.
references:
    - https://www.group-ib.com/blog/gitlab-jenkins-forensics/
author: ioc-yara-daily (agentic)
date: 2024-07-24
tags:
    - attack.persistence
    - attack.t1136
logsource:
    category: file_event
    product: linux
detection:
    selection:
        TargetFilename|re: '\/users\/[a-zA-Z0-9._-]+\_[a-zA-Z0-9]+\.xml$'
        Image|endswith: '/java'
    condition: selection
falsepositives:
    - 'Custom or non-standard Jenkins plugins might create user files in this format.'
level: medium
