title: ABYSSWORKER Driver Device Object Creation
id: 5698b67c-d6b9-43c1-b0e2-76340277839e
status: experimental
description: Detects the 'svcservice.exe' process creating a handle to the ABYSSWORKER device object. This driver is used to disable security products as part of MEDUSA ransomware campaigns.
references:
    - https://www.elastic.co/security-labs/threat-command/abyssworker
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.t1562
    - attack.t1222
    - detection.threat_hunting
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\AppData\Roaming\svcservice.exe'
        TargetFilename: '\device\czx9umpTReqbOOKF'
    condition: selection
falsepositives:
    - Unlikely
level: critical
