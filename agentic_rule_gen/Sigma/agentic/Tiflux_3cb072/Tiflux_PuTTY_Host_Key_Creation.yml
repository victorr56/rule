title: Tiflux PuTTY Host Key Creation
id: c0825f38-4e8c-4a1d-9e66-417163c47313
status: experimental
description: Detects the creation of a specific PuTTY SSH host key registry value by Tiflux malware. This key contains a hardcoded C2 domain and public key.
references:
    - https://www.huntress.com/blog/tiflux-rmm-install
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.command_and_control
    - attack.t1572
    - detection.threat_hunting
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\SshHostKeys\rsa2@22:remote1a.peopleone.com.br'
        Details|contains: '0x23,0x499d3e89,0x1ff26a57,0x8b824559' # Start of the hardcoded RSA public key
    condition: selection
falsepositives:
    - Unlikely
level: critical
