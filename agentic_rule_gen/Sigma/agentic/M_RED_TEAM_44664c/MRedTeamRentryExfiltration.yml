title: M-RED-TEAM Exfiltration via Rentry.co
id: e90b2401-2092-4114-8f68-9de1c99026d3
status: experimental
description: Detects command-line usage of common data transfer tools to exfiltrate data to a specific Rentry.co dead-drop URL used by M-RED-TEAM.
references:
    - https://www.wiz.io/blog/m-red-team-asyncapi-supply-chain-compromise-via-github-actions
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.exfiltration
    - attack.t1071.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\curl.exe'
            - '\wget.exe'
        CommandLine|contains: 'rentry.co/elzotebo'
    condition: selection
falsepositives:
    - Unlikely
level: high
