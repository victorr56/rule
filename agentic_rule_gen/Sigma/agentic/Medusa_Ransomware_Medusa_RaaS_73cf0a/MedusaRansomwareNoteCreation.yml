title: Medusa Ransomware Note Creation
id: c4b18c65-0a91-4e4b-9721-a3f2d259c7f6
status: experimental
description: Detects the creation of the Medusa ransom note "!!!READ_ME_MEDUSA!!!.txt" by the Medusa ransomware executable.
references:
    - https://www.darktrace.com/blog/under-medusas-gaze-how-darktrace-uncovers-rmm-abuse-in-ransomware-campaigns
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.impact
    - attack.t1486
logsource:
    product: windows
    category: file_event
detection:
    selection:
        Image|endswith: '\medusa.exe'
        TargetFilename|endswith: '\!!!READ_ME_MEDUSA!!!.txt'
    condition: selection
falsepositives:
    - Unlikely
level: critical
