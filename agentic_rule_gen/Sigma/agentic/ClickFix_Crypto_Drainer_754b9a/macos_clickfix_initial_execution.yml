title: ClickFix Crypto Drainer Initial Execution
id: 5e63836d-f4eb-48b7-a068-07d066928e1d
status: experimental
description: Detects the initial command line pasted into a terminal to download and execute the ClickFix crypto drainer. This command uses curl to download a script to /tmp, executes it with bash, removes it, and clears shell history.
references:
    - https://www.huntress.com/blog/mac-crypto-draining-malware
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.execution
    - attack.t1059.004
    - attack.defense_evasion
    - attack.t1070.003
    - attack.command_and_control
    - attack.t1105
    - detection.threat_hunting
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith:
            - '/bash'
            - '/sh'
            - '/zsh'
        CommandLine|contains|all:
            - 'cd /tmp'
            - 'curl '
            - '-o .UlaccK'
            - 'bash .UlaccK'
            - 'rm -f .UlaccK'
            - 'history -d'
    condition: selection
falsepositives:
    - Unlikely
level: high
