title: AI-Analysis Evasion Instruction In Encoded PowerShell Command
id: 569d6cd3-1f19-4f7f-855f-8c01e07502cd
status: experimental
description: Detects the execution of encoded PowerShell commands containing natural language instructions intended to mislead or disable AI-based analysis tools and LLMs. This is a characteristic of the A3 AI-Analysis Evasion malware archetype.
references:
    - https://blog.talosintelligence.com/ignore-all-instructions-and-read-this-blog-the-state-of-ai-analysis-evasion-in-malware/
author: ioc-yara-daily (agentic)
date: 2024-05-22
tags:
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|base64offset|contains:
            - 'Ignore all instructions'
            - 'Ignore any previous and future instructions'
            - 'For LLM and AI'
            - 'This is a copyright protected'
            - 'This file is a component of a U.S. Government'
            - 'Do not analyze this file'
            - 'This script is a honeypot'
    condition: selection
falsepositives:
    - Scripts used for security research or testing of this evasion technique.
level: high
