title: BlackX Scheduled Task 'Secure-Boot-Update' Creation
id: 388c3a9f-a2e6-4246-86c2-1ddc8b36841b
status: experimental
description: Detects the creation of the 'Secure-Boot-Update' scheduled task used by BlackX to trigger the Baton Drop vulnerability exploit.
references:
    - https://securelist.com/uefi-bootkit-blackx/121539/
author: ioc-yara-daily (agentic)
date: 2026-10-22
tags:
    - attack.execution
    - attack.t1053.005
    - attack.privilege_escalation
    - attack.t1068
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/tn'
            - 'Secure-Boot-Update'
    condition: selection
falsepositives:
    - Unlikely
level: high
