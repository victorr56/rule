title: Suspicious Process Launched With Chrome Network Service Argument
id: c4e356e9-e3ba-4ab7-accc-992a62888741
status: experimental
description: Detects a non-Chrome process being launched with a command-line argument normally used by Chrome to identify its network service sub-process. This could indicate an infostealer like STEALC or VIDAR attempting to masquerade as or inject into a legitimate Chrome process.
references:
    - https://www.elastic.co/security-labs/threat-command/katz-and-mouse-game
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.credential_access
    - attack.t1555.003
    - detection.threat_hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains: '--utility-sub-type=network.mojom.NetworkService'
        Image|contains:
            - ':\ProgramData\'
            - ':\Users\'
            - ':\Windows\Temp\'
            - '\AppData\Local\Temp\'
    filter_legit_browser:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\brave.exe'
            - '\opera.exe'
            - '\vivaldi.exe'
    condition: selection and not filter_legit_browser
falsepositives:
    - Legitimate software that bundles a Chromium component and runs it from a temporary or user-profile location.
    - Other legitimate Chromium-based browsers not included in the filter.
level: high
