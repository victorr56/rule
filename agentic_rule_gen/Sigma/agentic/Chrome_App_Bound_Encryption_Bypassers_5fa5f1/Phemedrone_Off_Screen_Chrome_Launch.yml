title: Phemedrone Infostealer Off-Screen Chrome Launch
id: 5b6c31a3-2c1b-4f9e-8367-e9a0c79e7c4f
status: experimental
description: Detects the launch of Google Chrome with specific off-screen window coordinates, a technique used by the Phemedrone infostealer to hide its activity from the user while exfiltrating data.
references:
    - https://www.elastic.co/security-labs/threat-command/katz-and-mouse-game
author: ioc-yara-daily (agentic)
date: 2026-10-29
tags:
    - attack.credential_access
    - attack.t1555.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\chrome.exe'
        CommandLine|contains: 'window-position=-2400,-2400'
    condition: selection
falsepositives:
    - 'Extremely unlikely.'
level: critical
