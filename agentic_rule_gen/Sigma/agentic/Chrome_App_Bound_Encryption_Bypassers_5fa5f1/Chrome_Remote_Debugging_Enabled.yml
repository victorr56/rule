title: Google Chrome Launched With Remote Debugging Enabled
id: 2d1ab312-d850-482d-86ac-ff6e04d49818
status: experimental
description: Detects the launch of Google Chrome with the remote debugging port enabled on the default port 9222. This feature can be abused by infostealers like PHEMEDRONE to programmatically interact with the browser and steal credentials or cookies.
references:
    - https://www.elastic.co/security-labs/threat-command/katz-and-mouse-game
author: ioc-yara-daily (agentic)
date: 2026-10-29
tags:
    - attack.credential_access
    - attack.t1555.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\chrome.exe'
        CommandLine|contains: '--remote-debugging-port=9222'
    condition: selection
falsepositives:
    - Web developers and QA automation frameworks (e.g., Selenium, Puppeteer) use this feature legitimately.
level: medium
