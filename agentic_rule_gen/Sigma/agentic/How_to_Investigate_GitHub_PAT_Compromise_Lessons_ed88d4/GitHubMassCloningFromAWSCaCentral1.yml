title: GitHub Mass Cloning Activity From AWS ca-central-1
id: 59a15f3a-1edb-449e-87d2-7935759a2f64
status: experimental
description: >-
  Detects mass cloning of GitHub repositories from specific AWS IPs in ca-central-1 using the 'git/2.43.0' user agent,
  as observed in a campaign leveraging compromised GitHub Personal Access Tokens in June 2026.
references:
  - https://www.wiz.io/blog/investigating-github-pat-compromise
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
  - attack.collection
  - attack.t1213.002
  - attack.credential_access
  - attack.t1078
logsource:
  category: proxy
detection:
  selection:
    HttpUserAgent: 'git/2.43.0'
    SourceIp:
      - '3.96.138.214'
      - '15.157.62.127'
      - '15.223.74.214'
      - '15.223.204.99'
      - '15.223.207.112'
      - '16.52.86.223'
      - '35.182.157.210'
      - '35.183.65.4'
      - '35.183.106.137'
      - '35.183.112.105'
      - '52.60.229.238'
      - '99.79.193.97'
  condition: selection
falsepositives:
  - Legitimate git activity from these specific IPs. The IPs may be reassigned by the cloud provider over time.
level: high
