title: MacOS Stealer V2 LaunchDaemon Persistence
id: f6165e6d-541e-453d-8153-2415d481da40
status: experimental
description: Detects the command used by macos-stealer-v2 to install a LaunchDaemon for persistence by copying a specific plist file.
references:
    - https://blog.virustotal.com/2026/10/introducing-macos-mirage.html.html
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - detection.threat_hunting
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/bin/cp'
        CommandLine|contains|all:
            - '/tmp/daemonplist'
            - '/Library/LaunchDaemons/com.somedaemon.plist'
    condition: selection
falsepositives:
    - Legitimate administrative scripts copying files with these exact names, which is highly unlikely.
level: high
