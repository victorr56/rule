title: MacOS Stealer V2 Credential Phishing With Osascript
id: 574b62d2-28c7-4340-8b1e-b81b83d1c447
status: experimental
description: Detects the execution of a malicious AppleScript command used by macos-stealer-v2 to display a fake password dialog, notable for the typo "passwen".
references:
    - https://blog.virustotal.com/2026/10/introducing-macos-mirage.html.html
author: ioc-yara-daily (agentic)
date: 2026-10-16
tags:
    - attack.t1059.002
    - attack.t1056.002
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/usr/bin/osascript'
        CommandLine|contains|all:
            - 'set passwen to display dialog'
            - 'Please enter device password to continue.'
            - 'with icon caution'
    condition: selection
falsepositives:
    - Unlikely
level: high
