title: MacOS Stealer V2 Hidden State File Creation
id: 0303c7e7-3f8d-429a-9e1e-d4c38d1e08c6
status: experimental
description: Detects the creation of hidden state files used by the macos-stealer-v2 (a.k.a. AMOS/Creal Rust variant) implant. This rule looks for a process commonly named 'file-helper' creating files such as '.bhost' or '.phost'.
references:
    - https://www.sentinelone.com/labs/macos-stealer-updated-amos-variant-rewritten-in-rust/
author: ioc-yara-daily (agentic)
date: 2023-10-24
tags:
    - attack.collection
    - attack.t1005
    - detection.threat_hunting
logsource:
    category: file_event
    product: macos
detection:
    selection:
        Image|endswith: '/file-helper'
        TargetFilename|endswith:
            - '/.bhost'
            - '/.phost'
            - '/.username'
            - '/.botid'
    condition: selection
falsepositives:
    - Legitimate software named 'file-helper' creating similarly named hidden configuration files.
level: high
