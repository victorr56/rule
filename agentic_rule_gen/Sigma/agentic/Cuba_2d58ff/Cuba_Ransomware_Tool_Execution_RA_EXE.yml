title: Cuba Ransomware Associated Tool Execution 'ra.exe'
id: 9c9d9241-11d2-4416-8097-9e79782a938c
status: experimental
description: Detects the execution of 'ra.exe', a renamed version of the NetSupport Manager client 'Client32.exe', from the 'C:\ProgramData' directory. This has been observed in Cuba ransomware campaigns.
references:
    - https://www.elastic.co/security-labs/threat-command/cuba-ransomware-campaign-analysis
author: ioc-yara-daily (agentic)
date: 2024-05-21
tags:
    - attack.execution
    - attack.t1036.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\ProgramData\ra.exe'
        OriginalFileName: 'Client32.exe'
    condition: selection
falsepositives:
    - Unlikely. Requires a legitimate NetSupport Manager client to be renamed to 'ra.exe' and placed in the ProgramData folder.
level: high
