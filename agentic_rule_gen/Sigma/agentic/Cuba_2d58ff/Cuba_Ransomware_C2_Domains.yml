title: Cuba Ransomware C2 Domain Query
id: 27e2213d-51cc-40b5-9b2f-3d0cf1ef1739
status: experimental
description: Detects DNS queries for domains known to be used as C2 servers by Cuba ransomware.
references:
    - https://www.elastic.co/security-labs/threat-command/cuba-ransomware-campaign-analysis
author: ioc-yara-daily (agentic)
date: 2026-10-22
tags:
    - attack.command_and_control
logsource:
    category: dns_query
    product: windows
detection:
    selection:
        QueryName:
            - 'mvnetworking.com'
            - 'bluetechsupply.com'
    condition: selection
falsepositives:
    - Unlikely
level: high
