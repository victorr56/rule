title: CastleLoader Portable IronPython Execution
id: c383a8b2-b13c-44e2-9b24-b17bd967c3b2
status: experimental
description: Detects the execution of a randomly named executable from a portable IronPython path, a specific behavior of CastleLoader.
references:
    - https://redcanary.com/blog/intelligence-insights-july-2024/
author: ioc-yara-daily (agentic)
date: 2024-07-24
tags:
    - attack.execution
    - attack.t1059.006
    - attack.defense_evasion
    - attack.t1036
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|contains: '\ironpython-'
        Image|re: '\\net\d+\\\d{12,18}\.exe$'
    condition: selection
falsepositives:
    - Legitimate use of portable IronPython with numerically named executables, which is highly unlikely.
level: high
