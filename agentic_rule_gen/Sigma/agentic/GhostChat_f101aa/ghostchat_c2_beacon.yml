title: GhostChat C2 Beacon
id: 79f753ca-8d39-4d69-b50a-f0f5b90f5bca
status: experimental
description: Detects the specific URI path and User-Agent used in C2 communications by the GhostChat Windows payload.
references:
    - https://www.welivesecurity.com/en/eset-research/love-actually-fake-dating-app-used-lure-targeted-spyware-campaign-pakistan/
author: ioc-yara-daily (agentic)
date: 2026-10-27
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection:
        Url|contains: '/page.php?tynor='
        UserAgent: 'Mozilla/5.0 (Windows NT 6.1; WOW64; rv:35.0) Gecko/20100101 Firefox/35.0'
    condition: selection
falsepositives:
    - Unlikely
level: high
