title: LATRODECTUS C2 Network Patterns
id: c1b9a8e7-8f5c-4d7a-8d1e-9e7f6a5d4c3b
status: experimental
description: Detects network traffic patterns characteristic of LATRODECTUS C2 communication, including a unique User-Agent and specific URI paths.
references:
    - https://www.elastic.co/security-labs/threat-command/spring-cleaning-with-latrodectus
author: ioc-yara-daily (agentic)
date: 2024-06-12
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection:
        UserAgent: 'Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 5.1; Tob 1.1)'
        Url|contains:
            - '/files/bp.dat'
            - '/live/?ver=1.1'
    condition: selection
falsepositives:
    - Unlikely
level: high
