title: FakeSecurity Campaign Payload Download via Proxy
id: 1729ae59-45e0-4740-972c-29d91a92e1e9
status: experimental
description: Detects HTTP requests for URI paths associated with the download of Raccoon Stealer, Buer Loader, and Smoke Loader in FakeSecurity campaigns.
references:
    - https://www.group-ib.com/blog/fakesecurity-raccoon/
author: ioc-yara-daily (agentic)
date: 2026-10-24
tags:
    - attack.initial_access
    - attack.t1189
logsource:
    category: proxy
    product: any
detection:
    selection:
        Url|endswith:
            - '/doc/officebuilder'
            - '/msofficeupdate.exe'
            - '/file_d/adobe-reader-v13.11.1.3.exe'
            - '/doc/officeupdate.exe'
            - '/doc/buer.exe'
            - '/doc/loader.exe'
        Http.ContentType|contains:
            - 'application/octet-stream'
            - 'application/x-msdownload'
            - 'application/vnd.microsoft.portable-executable'
    condition: selection
falsepositives:
    - Unlikely
level: high
