title: Raccoon Stealer C2 Beaconing via Telegram
id: 56930064-9f20-4354-94c6-be117c0a76a5
status: experimental
description: Detects Raccoon Stealer retrieving its C2 server address from a public Telegram channel via the telete.in proxy.
references:
    - https://www.group-ib.com/blog/fakesecurity-raccoon/
author: ioc-yara-daily (agentic)
date: 2024-05-24
tags:
    - attack.command_and_control
    - attack.t1102
logsource:
    category: proxy
detection:
    selection:
        DestinationHostname: 'telete.in'
        Url|contains: '/blintick'
    condition: selection
falsepositives:
    - Unlikely
level: critical
